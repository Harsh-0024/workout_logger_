{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center custom-review-page">
    <div class="col-12 col-md-10 col-lg-8">
        <form method="POST" action="{{ url_for('retrieve_custom') }}" id="customReviewForm" class="card custom-review-card">
            {% if ENABLE_CSRF %}
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            {% endif %}

            <div class="text-center custom-review-heading">
                <div class="custom-review-heading-icon"><i class="bi bi-card-checklist" aria-hidden="true"></i></div>
                <h2 class="mb-0 fw-bold">Review Exercises</h2>
            </div>

            <div class="review-summary">
                <span id="reviewCount">{{ exercises | length }}</span> selected
            </div>

            <div id="reviewExerciseList" class="review-exercise-list" aria-label="Selected exercises">
                {% for exercise in exercises %}
                <article class="review-exercise-item" data-key="{{ exercise.key }}">
                    <div class="review-exercise-copy">
                        <h3>{{ exercise.name }}</h3>
                        <span class="review-set-description">Default: 3 sets</span>
                    </div>
                    <div class="review-exercise-actions">
                        <button type="button" class="review-set-toggle" data-key="{{ exercise.key }}" role="switch" aria-checked="{{ 'true' if exercise.key in two_set_keys else 'false' }}" aria-label="Set count for {{ exercise.name }}">
                            <span>{{ '2 sets' if exercise.key in two_set_keys else '3 sets' }}</span>
                        </button>
                        <button type="button" class="review-remove-button" data-key="{{ exercise.key }}" aria-label="Remove {{ exercise.name }}">
                            <i class="bi bi-x-lg" aria-hidden="true"></i>
                        </button>
                    </div>
                </article>
                {% endfor %}
            </div>

            <p id="emptyReviewMessage" class="text-muted text-center py-4 mb-0" hidden>No exercises selected. Add exercises to continue.</p>
            <div id="reviewSelectionFields"></div>

            <div class="review-actions">
                <button type="submit" id="reviewGetWorkoutBtn" class="btn btn-gold-solid w-100 py-3 fw-bold">
                    <i class="bi bi-clipboard2-pulse-fill me-2" aria-hidden="true"></i>Get Workout <span id="reviewGetWorkoutCount"></span>
                </button>
                <button type="submit" formaction="{{ url_for('retrieve_custom_review') }}" name="review_action" value="add_more" class="btn btn-gold-outline w-100 py-3 fw-bold" id="addExercisesBtn">
                    <i class="bi bi-plus-circle me-2" aria-hidden="true"></i>Add Exercises
                </button>
            </div>

            <div class="text-center pt-3 mt-3 border-top" style="border-color: var(--border-subtle) !important;">
                <button type="submit" formaction="{{ url_for('retrieve_custom_review') }}" name="review_action" value="add_more" class="review-return-button text-muted small hover-gold tracking-wide">
                    <i class="bi bi-arrow-left me-1"></i>Back to exercise selection
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    (function() {
        let selectedKeys = {{ exercises | map(attribute='key') | list | tojson }};
        const twoSetKeys = new Set({{ two_set_keys | tojson }});
        const form = document.getElementById('customReviewForm');
        const fields = document.getElementById('reviewSelectionFields');
        const list = document.getElementById('reviewExerciseList');
        const count = document.getElementById('reviewCount');
        const getWorkoutBtn = document.getElementById('reviewGetWorkoutBtn');
        const getWorkoutCount = document.getElementById('reviewGetWorkoutCount');
        const emptyMessage = document.getElementById('emptyReviewMessage');
        const itemsByKey = new Map(
            Array.from(list.querySelectorAll('.review-exercise-item')).map(item => [item.dataset.key, item])
        );

        const syncFields = () => {
            fields.replaceChildren();
            for (const key of selectedKeys) {
                const exerciseField = document.createElement('input');
                exerciseField.type = 'hidden';
                exerciseField.name = 'exercise';
                exerciseField.value = key;
                fields.append(exerciseField);
                if (twoSetKeys.has(key)) {
                    const twoSetField = document.createElement('input');
                    twoSetField.type = 'hidden';
                    twoSetField.name = 'two_set_exercise';
                    twoSetField.value = key;
                    fields.append(twoSetField);
                }
            }
        };

        const render = () => {
            const selected = new Set(selectedKeys);
            for (const [key, item] of itemsByKey) {
                const isSelected = selected.has(key);
                item.hidden = !isSelected;
                if (!isSelected) continue;
                list.append(item);
                const setToggle = item.querySelector('.review-set-toggle');
                const usesTwoSets = twoSetKeys.has(key);
                setToggle.classList.toggle('is-active', usesTwoSets);
                setToggle.setAttribute('aria-checked', String(usesTwoSets));
                setToggle.querySelector('span').textContent = usesTwoSets ? '2 sets' : '3 sets';
            }
            count.textContent = String(selectedKeys.length);
            getWorkoutCount.textContent = selectedKeys.length ? `(${selectedKeys.length})` : '';
            getWorkoutBtn.disabled = selectedKeys.length === 0;
            emptyMessage.hidden = selectedKeys.length !== 0;
            syncFields();
        };

        list.addEventListener('click', event => {
            const setToggle = event.target.closest('.review-set-toggle');
            if (setToggle) {
                const key = setToggle.dataset.key;
                if (twoSetKeys.has(key)) {
                    twoSetKeys.delete(key);
                } else {
                    twoSetKeys.add(key);
                }
                render();
                return;
            }

            const removeButton = event.target.closest('.review-remove-button');
            if (removeButton) {
                const key = removeButton.dataset.key;
                selectedKeys = selectedKeys.filter(selectedKey => selectedKey !== key);
                twoSetKeys.delete(key);
                render();
            }
        });

        form.addEventListener('submit', syncFields);
        render();
    })();
</script>

<style>
    .custom-review-card {
        max-width: 760px;
        margin: 0 auto;
    }

    .custom-review-heading {
        margin-bottom: 1.25rem;
    }

    .custom-review-heading-icon {
        margin-bottom: 0.65rem;
        color: var(--gold-primary);
        font-size: 2.5rem;
        line-height: 1;
    }

    .custom-review-heading h2 {
        font-size: clamp(1.5rem, 5vw, 2rem);
    }

    .review-summary {
        margin-bottom: 0.75rem;
        color: var(--gold-bright);
        font-size: var(--fs-sm);
        font-weight: 700;
        text-transform: uppercase;
    }

    .review-exercise-list {
        display: grid;
        gap: 0.6rem;
    }

    .review-exercise-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.85rem;
        min-height: 4.25rem;
        padding: 0.75rem 0.85rem;
        border: 1px solid var(--border-subtle);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.02);
    }

    .review-exercise-copy {
        min-width: 0;
    }

    .review-exercise-copy h3 {
        margin: 0;
        color: var(--text-primary);
        font-size: var(--fs-sm);
        font-weight: 700;
        overflow-wrap: anywhere;
    }

    .review-set-description {
        display: block;
        margin-top: 0.2rem;
        color: var(--text-muted);
        font-size: var(--fs-xs);
    }

    .review-exercise-actions {
        display: flex;
        flex: 0 0 auto;
        align-items: center;
        gap: 0.45rem;
    }

    .review-set-toggle {
        min-width: 4.6rem;
        min-height: 2rem;
        padding: 0.2rem 0.55rem;
        border: 1px solid var(--border-gold);
        border-radius: 999px;
        background: var(--card-bg-solid);
        color: var(--text-secondary);
        font-size: var(--fs-xs);
        font-weight: 700;
        white-space: nowrap;
    }

    .review-set-toggle.is-active {
        border-color: var(--gold-primary);
        background: var(--gold-primary);
        color: #111111;
    }

    .review-remove-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 2rem;
        height: 2rem;
        padding: 0;
        border: 1px solid var(--border-gold);
        border-radius: 0.55rem;
        background: transparent;
        color: var(--gold-primary);
        line-height: 1;
    }

    .review-actions {
        display: grid;
        gap: 0.65rem;
        margin-top: 1rem;
    }

    .review-return-button {
        padding: 0;
        border: 0;
        background: transparent;
        font: inherit;
    }

    @media (max-width: 576px) {
        .custom-review-page {
            margin-bottom: 1rem;
        }

        .custom-review-card {
            padding: 1rem;
            border-radius: 16px;
        }

        .custom-review-heading {
            margin-bottom: 1rem;
        }

        .custom-review-heading-icon {
            margin-bottom: 0.45rem;
            font-size: 2rem;
        }

        .custom-review-heading h2 {
            font-size: 1.35rem;
        }

        .review-exercise-list {
            gap: 0.45rem;
        }

        .review-exercise-item {
            min-height: 3.6rem;
            gap: 0.55rem;
            padding: 0.55rem 0.6rem;
        }

        .review-exercise-copy h3 {
            font-size: 0.85rem;
            line-height: 1.25;
        }

        .review-set-description {
            display: none;
        }

        .review-exercise-actions {
            gap: 0.35rem;
        }

        .review-set-toggle {
            min-width: 4.2rem;
            min-height: 1.8rem;
            padding: 0.15rem 0.4rem;
            font-size: 0.7rem;
        }

        .review-remove-button {
            width: 1.8rem;
            height: 1.8rem;
            min-width: 1.8rem;
            min-height: 1.8rem;
            padding: 0 !important;
            border-radius: 0.5rem;
            font-size: 0.7rem;
        }
    }
</style>
{% endblock %}
