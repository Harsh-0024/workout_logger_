{#- Workout text editor shared by Log and Edit: a text box that scrolls inside itself, name suggestions,
    and the live check ("Check" list) that runs before saving. Needs _settings_ui styles. -#}
<style>
    .lg-editor-group { position: relative; }
    /* The box grows with the text up to a cap, then scrolls inside itself, so a long
       workout never pushes the Check list screens away. Scrolling past its end carries on
       down the page. 1.75em is the editor's line height. */
    .st .lg-editor {
        min-height: 34vh;
        max-height: 50vh;
        resize: none;
        overflow-y: auto;
    }
    @media (max-width: 576px) {
        /* Six and a half lines: two whole exercises, with the half line hinting there is more. */
        .st .lg-editor { min-height: calc(6.5 * 1.75em + 32px); max-height: calc(6.5 * 1.75em + 32px); }
    }
    .st .lg-editor::placeholder { color: var(--text-subtle); opacity: 0.7; }
    /* Save bar floats at the bottom while the editor or the check is on screen. */
    .lg-flow { display: flex; flex-direction: column; gap: 28px; }
    .lg-bar {
        position: sticky; bottom: 16px; z-index: 7;
        display: flex; align-items: center; justify-content: space-between; gap: 12px;
        padding: 10px 12px 10px 18px;
        border-radius: 16px;
        border: 1px solid var(--border-subtle);
        background: var(--card-bg-solid);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }
    [data-theme="light"] .lg-bar { box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08); }
    .lg-check .st-label { margin-top: 0; }
    .lg-bar-actions { display: flex; gap: 8px; flex: none; }
    .lg-bar-actions .st-btn i { font-size: 0.95rem; }
    .lg-bar-info { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .lg-undo {
        flex: none; padding: 4px 0; border: 0; background: none;
        font-size: 0.8rem; font-weight: 600; color: var(--st-accent);
    }
    .lg-meta {
        min-width: 0;
        padding: 0; border: 0; background: none;
        text-align: left;
        font-size: 0.8rem; color: var(--text-subtle);
        font-variant-numeric: tabular-nums;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .lg-meta.is-error { color: var(--st-down); font-weight: 600; }
    .lg-meta.is-warn { color: var(--st-warn); }
    .lg-meta.is-stacked { white-space: normal; line-height: 1.3; }
    .lg-meta.is-stacked .lg-meta-part { display: block; }
    .lg-meta.is-stacked .lg-meta-sep { display: none; }
    .lg-meta-sub { display: block; margin-top: 2px; font-size: 0.74rem; font-weight: 600; color: var(--st-warn); }

    /* Name suggestions float just under the line being typed. */
    .lg-suggest {
        position: absolute; left: 12px; right: 12px; z-index: 6;
        max-width: 360px;
        padding: 6px;
        border-radius: 12px;
        border: 1px solid var(--border-primary);
        background: var(--card-bg-solid);
        box-shadow: var(--shadow-md);
    }
    .lg-suggest[hidden] { display: none; }
    .lg-suggest button {
        display: block; width: 100%;
        padding: 9px 12px;
        border: 0; border-radius: 8px;
        background: transparent;
        text-align: left;
        font: 500 0.88rem 'Inter', system-ui, sans-serif;
        color: var(--text-secondary);
    }
    .lg-suggest button.is-active, .lg-suggest button:hover { background: var(--gold-subtle); color: var(--text-primary); }

    /* Notes above the list: problems, and "that day already has a workout". */
    .lg-callout {
        display: flex; gap: 12px; align-items: flex-start;
        margin: 18px 0 0;
        padding: 14px 16px;
        border-radius: 14px;
        border: 1px solid var(--st-hair);
        background: var(--st-row-hover);
        font-size: 0.86rem; line-height: 1.5; color: var(--text-secondary);
    }
    .lg-check .lg-callout { margin: 0 0 12px; }
    .lg-callout > i { flex: none; font-size: 1rem; line-height: 1.35; color: var(--st-accent); }
    .lg-callout strong { color: var(--text-primary); font-weight: 600; }
    .lg-callout p { margin: 3px 0 0; }
    .lg-callout.is-error { border-color: var(--st-down-line); background: var(--st-down-bg); }
    .lg-callout.is-error > i { color: var(--st-down); }
    .lg-callout.is-warn { border-color: var(--st-warn-line); background: var(--st-warn-bg); }
    .lg-callout.is-warn > i { color: var(--st-warn); }
    .lg-callout a { color: var(--st-accent); font-weight: 600; text-decoration: none; }
    .lg-callout-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

    /* One row per exercise, the way it will be saved. */
    .lg-row {
        display: flex; align-items: flex-start; gap: 12px;
        padding: 13px 18px;
        cursor: pointer;
        transition: background var(--transition-fast);
        -webkit-tap-highlight-color: transparent;
    }
    .lg-row + .lg-row { border-top: 1px solid var(--st-hair); }
    .lg-row:hover { background: var(--st-row-hover); }
    /* A soft gold while pressed, like the Retrieve tiles; phones skip it once a touch turns into a scroll. */
    .lg-row:active { background: var(--gold-subtle); }
    .lg-row:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--gold-glow); }
    .lg-num { flex: none; width: 22px; padding-top: 2px; font-size: 0.7rem; color: var(--text-subtle); font-variant-numeric: tabular-nums; opacity: 0.8; }
    .lg-row-main { flex: 1; min-width: 0; }
    .lg-name { display: block; font-size: 0.93rem; font-weight: 600; line-height: 1.35; color: var(--text-primary); overflow-wrap: anywhere; }
    .lg-sets { display: block; margin-top: 3px; font-size: 0.8rem; line-height: 1.45; color: var(--text-muted); font-variant-numeric: tabular-nums; }
    .lg-note { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin-top: 5px; font-size: 0.8rem; line-height: 1.45; color: var(--text-muted); }
    .lg-tag { flex: none; padding-top: 2px; font-size: 0.74rem; font-weight: 600; color: var(--text-subtle); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .lg-row.is-new .lg-tag { color: var(--st-accent); }
    .lg-row.is-suggest .lg-tag, .lg-row.is-dup .lg-tag { color: var(--st-warn); }
    .lg-row.is-missing .lg-tag, .lg-row.is-missing .lg-name { color: var(--st-down); }
    .lg-row.is-skip .lg-name { color: var(--text-muted); font-weight: 500; text-decoration: line-through; text-decoration-color: var(--text-subtle); }
    .lg-fix {
        padding: 3px 10px;
        border-radius: 8px;
        border: 1px solid var(--st-warn-line);
        background: transparent;
        font: 600 0.78rem 'Inter', system-ui, sans-serif;
        color: var(--st-warn);
    }
    .lg-fix:hover { background: var(--st-warn-bg); }

    @media (max-width: 576px) {
        .lg-bar { bottom: calc(86px + env(safe-area-inset-bottom) + 10px); padding-left: 16px; }
        .lg-row { padding: 13px 16px; }
    }
</style>
<script>
    window.LogEditor = window.LogEditor || (function () {
        // iPhone Safari only shows :active press states when a touch listener exists.
        document.addEventListener('touchstart', () => {}, { passive: true });
        const esc = (value) => String(value == null ? '' : value)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

        // Grow with the text until the CSS cap; past that the box scrolls inside itself.
        function autoGrow(textarea) {
            const fit = () => {
                // Measuring collapses the box for a moment; keep the page where it was.
                const y = window.scrollY;
                textarea.style.height = 'auto';
                textarea.style.height = `${textarea.scrollHeight + 2}px`;
                if (window.scrollY !== y) window.scrollTo(0, y);
            };
            textarea.addEventListener('input', fit);
            window.addEventListener('resize', fit);
            window.addEventListener('load', fit);
            fit();
            textarea._fit = fit;
        }

        // Pixel position of a character inside the textarea (mirror-div technique).
        function caretTop(textarea, position) {
            const style = window.getComputedStyle(textarea);
            const mirror = document.createElement('div');
            ['boxSizing', 'width', 'paddingTop', 'paddingRight', 'paddingBottom', 'paddingLeft', 'borderTopWidth',
                'borderLeftWidth', 'fontFamily', 'fontSize', 'fontWeight', 'lineHeight', 'letterSpacing', 'wordSpacing',
                'tabSize'].forEach((key) => { mirror.style[key] = style[key]; });
            mirror.style.position = 'absolute';
            mirror.style.visibility = 'hidden';
            mirror.style.whiteSpace = 'pre-wrap';
            mirror.style.overflowWrap = 'break-word';
            mirror.textContent = textarea.value.slice(0, position);
            const marker = document.createElement('span');
            marker.textContent = '​';
            mirror.appendChild(marker);
            document.body.appendChild(mirror);
            const top = marker.offsetTop;
            const lineHeight = parseFloat(style.lineHeight) || 22;
            document.body.removeChild(mirror);
            return { top: top - textarea.scrollTop, lineHeight };
        }

        function lineRange(value, lineNo) {
            let start = 0;
            for (let i = 1; i < lineNo; i += 1) {
                const next = value.indexOf('\n', start);
                if (next === -1) return null;
                start = next + 1;
            }
            let end = value.indexOf('\n', start);
            if (end === -1) end = value.length;
            return { start, end };
        }

        function jumpToLine(textarea, lineNo) {
            const range = lineRange(textarea.value, lineNo);
            if (!range) return;
            textarea.focus({ preventScroll: true });
            // Caret at the start of the line (no selection, so typing can't wipe the numbers).
            textarea.setSelectionRange(range.start, range.start);
            // Scroll the box so the line sits one line below its top edge, then bring it into view.
            const style = window.getComputedStyle(textarea);
            const before = caretTop(textarea, range.start);
            const lineInContent = before.top + textarea.scrollTop - (parseFloat(style.paddingTop) || 0);
            textarea.scrollTop = Math.max(0, lineInContent - before.lineHeight);
            const { top } = caretTop(textarea, range.start);
            const y = textarea.getBoundingClientRect().top + window.scrollY + top - window.innerHeight * 0.3;
            window.scrollTo({ top: Math.max(0, y), behavior: 'smooth' });
        }

        function replaceLine(textarea, lineNo, text) {
            const range = lineRange(textarea.value, lineNo);
            if (!range) return;
            textarea.value = textarea.value.slice(0, range.start) + text + textarea.value.slice(range.end);
            textarea.dispatchEvent(new Event('input', { bubbles: true }));
        }

        // Some phone Notes apps copy with a blank line after every line, doubling the workout's
        // length. Only then (no two text lines touch anywhere) drop those blanks and put back one
        // gap before each name that follows a line of numbers. The parser needs no blank lines,
        // so this only changes how the text reads.
        const NUMBERS_LINE = /^\s*(?:bw\b|[+-]?\d)/i;
        function tidyPaste(text) {
            const lines = String(text || '').replace(/\r\n?/g, '\n').split('\n');
            const filled = lines.map((line) => line.trim() !== '');
            const touching = filled.some((isFilled, i) => isFilled && filled[i + 1]);
            if (touching || filled.filter(Boolean).length < 4) return text;
            const kept = lines.filter((line, i) => filled[i]);
            const out = [];
            kept.forEach((line, i) => {
                if (i > 0 && !NUMBERS_LINE.test(line)) out.push('');
                out.push(line);
            });
            return out.join('\n') + (/\n\s*$/.test(text) ? '\n' : '');
        }

        // After a whole workout lands, the caret is on its last line. Let the paste show for a
        // moment, then glide back up so the title is the first thing you read.
        function showFromTop(textarea) {
            setTimeout(() => {
                if (typeof textarea.scrollTo === 'function') textarea.scrollTo({ top: 0, behavior: 'smooth' });
                else textarea.scrollTop = 0;
            }, 220);
        }

        // Tidy doubled pastes, and return to the top when the paste is the whole workout
        // (an empty box, or everything selected); a line pasted mid-text stays where it is.
        function attachPasteTidy(textarea) {
            textarea.addEventListener('paste', (e) => {
                const text = e.clipboardData && e.clipboardData.getData('text/plain');
                if (!text) return;
                const whole = !textarea.value.trim()
                    || (textarea.selectionStart === 0 && textarea.selectionEnd === textarea.value.length);
                const tidy = tidyPaste(text);
                if (tidy !== text) {
                    e.preventDefault();
                    insertAtCursor(textarea, tidy);
                }
                if (whole) showFromTop(textarea);
            });
        }

        function insertAtCursor(textarea, text) {
            const start = textarea.selectionStart ?? textarea.value.length;
            const end = textarea.selectionEnd ?? start;
            if (typeof textarea.setRangeText === 'function') {
                textarea.setRangeText(text, start, end, 'end');
            } else {
                textarea.value = textarea.value.slice(0, start) + text + textarea.value.slice(end);
            }
            textarea.dispatchEvent(new Event('input', { bubbles: true }));
        }

        // Exercise-name suggestions while typing a name at the start of a line.
        function attachSuggestions(textarea, box, rawNames, options) {
            const firstLineIsTitle = !(options && options.firstLineIsTitle === false);
            if (!box || !Array.isArray(rawNames) || !rawNames.length) return;
            const seen = new Set();
            const names = rawNames.filter((name) => {
                const key = String(name || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
                if (!key || seen.has(key)) return false;
                seen.add(key);
                return true;
            });
            let items = [];
            let active = 0;

            const context = () => {
                const value = textarea.value;
                const cursor = textarea.selectionStart || 0;
                const lineStart = value.lastIndexOf('\n', cursor - 1) + 1;
                let lineEnd = value.indexOf('\n', cursor);
                if (lineEnd === -1) lineEnd = value.length;
                const line = value.slice(lineStart, lineEnd);
                const trimmed = line.trim();
                if (!trimmed || /^[\d,.\-]/.test(trimmed) || /^bw/i.test(trimmed)) return null;
                // Only the first line is the date and title.
                if (firstLineIsTitle && value.slice(0, lineStart).trim() === '') return null;
                let cut = line.length;
                [' - [', ' - ', ' – ', ' — ', ':', '['].forEach((sep) => {
                    const i = line.indexOf(sep);
                    if (i !== -1 && i < cut) cut = i;
                });
                const caret = cursor - lineStart;
                if (caret > cut) return null;
                const leading = line.match(/^\s*/)[0];
                const prefix = line.slice(leading.length, caret).trim();
                if (prefix.length < 2 || /\d/.test(prefix)) return null;
                // Mid-word: replace the rest of the name too; otherwise keep what follows the caret.
                const keepFrom = /^[A-Za-z]/.test(line.slice(caret, cut)) ? cut : caret;
                return { lineStart, lineEnd, leading, prefix, suffix: line.slice(keepFrom) };
            };

            const hide = () => { box.hidden = true; box.innerHTML = ''; items = []; };
            const show = () => {
                if (!items.length) { hide(); return; }
                box.innerHTML = items.map((name, i) =>
                    `<button type="button" role="option" data-i="${i}" class="${i === active ? 'is-active' : ''}">${esc(name)}</button>`).join('');
                const { top, lineHeight } = caretTop(textarea, textarea.selectionStart || 0);
                box.style.top = `${textarea.offsetTop + top + lineHeight + 4}px`;
                box.hidden = false;
            };
            const update = () => {
                const ctx = context();
                if (!ctx) { hide(); return; }
                const query = ctx.prefix.toLowerCase();
                const starts = names.filter((n) => n.toLowerCase().startsWith(query));
                const contains = names.filter((n) => !n.toLowerCase().startsWith(query) && n.toLowerCase().includes(query));
                items = starts.concat(contains).filter((n) => n.toLowerCase() !== query).slice(0, 6);
                active = 0;
                show();
            };
            const apply = (index) => {
                const name = items[index];
                const ctx = context();
                if (!name || !ctx) return;
                const replacement = `${ctx.leading}${name}${ctx.suffix}`;
                textarea.value = textarea.value.slice(0, ctx.lineStart) + replacement + textarea.value.slice(ctx.lineEnd);
                const caret = ctx.lineStart + ctx.leading.length + name.length;
                textarea.setSelectionRange(caret, caret);
                hide();
                textarea.dispatchEvent(new Event('input', { bubbles: true }));
                hide();
            };

            textarea.addEventListener('input', update);
            textarea.addEventListener('click', update);
            textarea.addEventListener('keydown', (event) => {
                if (box.hidden || !items.length) return;
                if (event.key === 'ArrowDown') { event.preventDefault(); active = (active + 1) % items.length; show(); }
                else if (event.key === 'ArrowUp') { event.preventDefault(); active = (active - 1 + items.length) % items.length; show(); }
                else if (event.key === 'Tab') { event.preventDefault(); apply(active); }
                else if (event.key === 'Escape') { hide(); }
            });
            // pointerdown + preventDefault keeps focus in the textarea while picking.
            box.addEventListener('pointerdown', (event) => {
                const button = event.target.closest('button[data-i]');
                if (!button) return;
                event.preventDefault();
                apply(Number(button.dataset.i));
            });
            textarea.addEventListener('blur', () => setTimeout(hide, 150));
        }

        // Debounced POST to the preview endpoint; only the newest answer is shown.
        function previewer(url, csrf, bodyFn, onData, onBusy) {
            let timer = null;
            let controller = null;
            const run = async () => {
                if (controller) controller.abort();
                controller = new AbortController();
                const body = bodyFn();
                body.append('csrf_token', csrf);
                if (onBusy) onBusy(true);
                try {
                    const res = await fetch(url, {
                        method: 'POST', body, credentials: 'same-origin',
                        headers: { 'X-CSRFToken': csrf }, signal: controller.signal,
                    });
                    onData(await res.json());
                } catch (e) {
                    if (e.name !== 'AbortError') onData({ ok: false, errors: [{ line: null, message: 'Couldn’t check right now. You can still save.' }], soft: true });
                } finally {
                    if (onBusy) onBusy(false);
                }
            };
            return {
                soon() { clearTimeout(timer); timer = setTimeout(run, 450); },
                now() { clearTimeout(timer); run(); },
            };
        }

        const TAGS = { ok: '', new: 'New', suggest: 'Check name', skip: 'Skipped', missing: 'No name', dup: 'Already logged' };

        // Draw the check. Returns what the save bar should say.
        function renderCheck(data, opts) {
            const { head, notes, list, textarea } = opts;
            const errors = (data && data.errors) || [];
            const warnings = (data && data.warnings) || [];
            const exercises = (data && data.exercises) || [];
            const view = { blocked: false, append: false, metaText: '', metaSub: '', metaClass: '' };

            if (head) {
                head.textContent = data && data.date_label
                    ? `${data.date_label}${data.date_found ? '' : ' (no date written)'} · ${data.title || ''}`
                    : '';
            }

            let notesHtml = '';
            if (errors.length && !data.soft) {
                notesHtml += `<div class="lg-callout is-error"><i class="bi bi-exclamation-circle"></i><div><strong>Fix ${errors.length === 1 ? 'this' : 'these'} before saving</strong>${errors.map((e) => `<p>${esc(e.message)}</p>`).join('')}</div></div>`;
            }
            const loose = warnings.filter((w) => w.line == null);
            if (loose.length) {
                notesHtml += `<div class="lg-callout is-warn"><i class="bi bi-info-circle"></i><div>${loose.map((w) => `<p>${esc(w.message)}</p>`).join('')}</div></div>`;
            }
            const existing = data && data.existing;
            const saveable = exercises.filter((e) => e.state !== 'skip' && e.state !== 'missing');
            if (existing && opts.allowAppend) {
                const allDup = saveable.length > 0 && saveable.every((e) => e.state === 'dup');
                if (allDup) {
                    view.blocked = true;
                    notesHtml += `<div class="lg-callout is-warn"><i class="bi bi-calendar-check"></i><div><strong>Already logged</strong><p>Everything here is already in ${esc(existing.title)} on that day.</p><div class="lg-callout-actions"><a class="st-btn st-btn-quiet st-btn-sm" href="${esc(existing.url)}">Open it</a></div></div></div>`;
                } else {
                    view.append = true;
                    notesHtml += `<div class="lg-callout"><i class="bi bi-calendar-plus"></i><div><strong>That day already has a workout</strong><p>Saving adds these to ${esc(existing.title)} (${existing.exercise_count} exercise${existing.exercise_count === 1 ? '' : 's'}). <a href="${esc(existing.url)}">Open it</a></p></div></div>`;
                }
            } else if (existing && opts.conflictMessage) {
                view.blocked = true;
                notesHtml += `<div class="lg-callout is-error"><i class="bi bi-calendar-x"></i><div><strong>${esc(opts.conflictMessage)}</strong><p><a href="${esc(existing.url)}">Open ${esc(existing.title)}</a></p></div></div>`;
            }
            notes.innerHTML = notesHtml;

            // Rows count the exercises 1, 2, 3; the line each one sits on is only used to jump there.
            let order = 0;
            list.innerHTML = exercises.map((ex) => {
                const number = ex.state === 'skip' ? '' : (order += 1);
                const tag = ex.state === 'ok' || ex.state === 'new'
                    ? (ex.state === 'new' ? 'New' : `${ex.set_count} set${ex.set_count === 1 ? '' : 's'}`)
                    : TAGS[ex.state] || '';
                let note = '';
                if (ex.state === 'suggest') {
                    note = `<span class="lg-note"><span>Did you mean <strong>${esc(ex.suggestion)}</strong>?</span>${ex.fix_line != null ? ` <button type="button" class="lg-fix" data-fix-line="${ex.line}" data-fix-text="${esc(ex.fix_line)}">Use it</button>` : ''}</span>`;
                } else if (ex.note && ex.state !== 'ok' && ex.state !== 'new') {
                    note = `<span class="lg-note">${esc(ex.note)}</span>`;
                }
                return `<div class="lg-row is-${esc(ex.state)}" role="button" tabindex="0" data-line="${ex.line || ''}">
                    <span class="lg-num">${number}</span>
                    <span class="lg-row-main"><span class="lg-name">${esc(ex.name)}</span>${ex.sets_label ? `<span class="lg-sets">${esc(ex.sets_label)}</span>` : ''}${note}</span>
                    <span class="lg-tag">${esc(tag)}</span>
                </div>`;
            }).join('');
            list.hidden = !exercises.length;

            if (!list._wired) {
                list._wired = true;
                const activate = (event) => {
                    const fix = event.target.closest('.lg-fix');
                    if (fix) {
                        event.stopPropagation();
                        replaceLine(textarea, Number(fix.dataset.fixLine), fix.dataset.fixText);
                        return;
                    }
                    const row = event.target.closest('.lg-row');
                    if (row && row.dataset.line) jumpToLine(textarea, Number(row.dataset.line));
                };
                list.addEventListener('click', activate);
                list.addEventListener('keydown', (event) => {
                    if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); activate(event); }
                });
            }

            if (errors.length && !data.soft) {
                view.blocked = true;
                view.metaText = `${errors.length} thing${errors.length === 1 ? '' : 's'} to fix`;
                view.metaClass = 'is-error';
            } else if (data && !data.soft) {
                const n = data.exercise_count || 0;
                const s = data.set_count || 0;
                const flagged = exercises.filter((e) => e.state === 'suggest' || e.state === 'skip' || e.state === 'dup').length + loose.length;
                view.metaText = `${n} exercise${n === 1 ? '' : 's'} · ${s} set${s === 1 ? '' : 's'}`;
                view.metaSub = flagged ? `${flagged} to look at` : '';
            } else {
                view.metaText = 'Couldn’t check right now';
            }
            return view;
        }

        function paintMeta(el, view) {
            el.className = 'lg-meta' + (view.metaClass ? ' ' + view.metaClass : '');
            const parts = String(view.metaText || '').split(' · ').map((part) => `<span class="lg-meta-part">${esc(part)}</span>`);
            el.innerHTML = parts.join('<span class="lg-meta-sep"> · </span>')
                + (view.metaSub ? `<span class="lg-meta-sub">${esc(view.metaSub)}</span>` : '');
            fitMeta(el);
        }

        // On a narrow phone "12 exercises · 36 sets" doesn't fit beside the buttons:
        // put the parts on two lines instead of cutting the count off.
        function fitMeta(el) {
            el.classList.remove('is-stacked');
            if (!el.querySelector('.lg-meta-sep') || el.querySelector('.lg-meta-sub')) return;
            if (el.scrollWidth > el.clientWidth + 1) el.classList.add('is-stacked');
        }
        window.addEventListener('resize', () => document.querySelectorAll('.lg-meta').forEach(fitMeta));

        return { paintMeta, autoGrow, attachSuggestions, attachPasteTidy, tidyPaste, showFromTop, previewer, renderCheck, insertAtCursor, jumpToLine, replaceLine };
    })();
</script>
