{% extends 'base.html' %}
{% block content %}
<div class="row">
    <div class="col-12">
        <div class="card stats-page">
            <div class="stats-header">
                <h1 class="stats-hero-label">
                    <span id="heroLabel">Overall strength</span>
                    <button type="button" id="heroInfoBtn" class="stats-info-btn" aria-expanded="false" aria-controls="heroInfo" aria-label="What is this?">
                        <i class="bi bi-info-circle"></i>
                    </button>
                </h1>
                <div class="stats-search">
                    <i class="bi bi-search stats-search-icon" aria-hidden="true"></i>
                    <input
                        id="exerciseSearch"
                        class="form-control"
                        type="text"
                        placeholder="Search an exercise"
                        aria-label="Search an exercise"
                        autocomplete="off"
                        oninput="handleSearchInput()"
                        onfocus="showSuggestions()"
                        onkeydown="handleKeyDown(event)"
                    >
                    <button type="button" id="exerciseClear" class="stats-search-clear" aria-label="Back to overall strength" hidden>
                        <i class="bi bi-x-lg"></i>
                    </button>
                    <div id="suggestionsList" class="position-absolute w-100 border mt-2" style="display: none;"></div>
                </div>
                <script type="application/json" id="exerciseOptionsData">{{ exercise_options | tojson }}</script>
                <script type="application/json" id="initialExerciseData">{{ {"value": initial_exercise or "", "label": initial_exercise_label or ""} | tojson }}</script>
                <script type="application/json" id="statsPreferencesData">{{ stats_preferences | tojson }}</script>
            </div>
            <p id="heroInfo" class="stats-hero-info" hidden></p>

            <!-- Headline: one number that answers "am I getting stronger?" -->
            <section id="statsHero" class="stats-hero" hidden>
                <div class="stats-hero-value" id="heroValue">-</div>
                <div class="stats-hero-text">
                    <div class="stats-hero-caption" id="heroCaption"></div>
                    <div class="stats-hero-change" id="heroChange"></div>
                </div>
                <div class="stats-segmented stats-range" role="group" aria-label="Time range">
                    <button type="button" class="range-pill" data-range="30">1M</button>
                    <button type="button" class="range-pill" data-range="90">3M</button>
                    <button type="button" class="range-pill" data-range="180">6M</button>
                    <button type="button" class="range-pill" data-range="365">1Y</button>
                    <button type="button" class="range-pill active" data-range="all">All</button>
                </div>
            </section>

            <div class="stats-chart-card">
                <div class="stats-chart-toolbar" id="chartToolbar">
                    <div class="stats-segmented" id="metricControls" role="group" aria-label="Metric" hidden>
                        <button type="button" class="metric-pill active" data-metric="e1rm">Est. max</button>
                        <button type="button" class="metric-pill" data-metric="top_weight">Heaviest</button>
                        <button type="button" class="metric-pill" data-metric="tonnage">Volume</button>
                    </div>
                </div>
                <div class="stats-chart">
                    <canvas id="progressChart"></canvas>
                    <div id="chartTip" class="chart-tip" role="status" hidden>
                        <div class="chart-tip-date"></div>
                        <div class="chart-tip-title"></div>
                        <div class="chart-tip-value"></div>
                        <div class="chart-tip-set"></div>
                    </div>
                    <div id="chartEmpty" class="stats-empty" hidden>
                        <i class="bi bi-graph-up"></i>
                        <span>Log a few workouts to see your progress here.</span>
                    </div>
                </div>
            </div>

            {% if bw_warning_enabled and bw_exercises %}
            <div id="bwStatsAlert" class="alert alert-warning mt-3 mb-0" role="alert" style="display: none; background: rgba(212, 175, 55, 0.12); border-color: rgba(212, 175, 55, 0.35); color: var(--platinum);">
                <i class="bi bi-info-circle me-2"></i>
                Set your bodyweight in Settings to see accurate numbers for <span id="bwStatsExercise" class="fw-semibold"></span>.
            </div>
            <script type="application/json" id="bwExercisesData">{{ bw_exercises | tojson }}</script>
            {% endif %}

            <div id="statsTiles" class="stats-tiles" hidden>
                <div class="stats-tile">
                    <div class="stats-tile-label" id="tile1Label">Best</div>
                    <div class="stats-tile-value" id="tile1Value">-</div>
                    <div class="stats-tile-sub" id="tile1Sub"></div>
                </div>
                <div class="stats-tile">
                    <div class="stats-tile-label" id="tile2Label">Workouts</div>
                    <div class="stats-tile-value" id="tile2Value">-</div>
                    <div class="stats-tile-sub" id="tile2Sub"></div>
                </div>
                <div class="stats-tile">
                    <div class="stats-tile-label" id="tile3Label">Per week</div>
                    <div class="stats-tile-value" id="tile3Value">-</div>
                    <div class="stats-tile-sub" id="tile3Sub"></div>
                </div>
            </div>

            <div class="stats-back-home text-center mt-5 pt-4 border-top" style="border-color: var(--border-subtle) !important;">
                <a href="/" class="text-muted text-decoration-none small hover-gold tracking-wide">
                    <i class="bi bi-arrow-left me-1"></i>Back Home
                </a>
            </div>
        </div>
    </div>
</div>

<style>
    .stats-page {
        --stats-up: var(--gold-primary, #D4AF37);
        --stats-down: #EF4444;
        --stats-surface: rgba(255, 255, 255, 0.02);
        --stats-seg-bg: rgba(255, 255, 255, 0.04);
    }

    [data-theme="light"] .stats-page {
        --stats-up: #A8841F;
        --stats-down: #DC2626;
        --stats-surface: #fffaf1;
        --stats-seg-bg: rgba(148, 126, 86, 0.08);
    }

    /* ---------- Header: label + search on one row ---------- */
    .stats-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem 1.25rem;
        flex-wrap: wrap;
    }

    .stats-search {
        position: relative;
        flex: 0 1 340px;
        min-width: 0;
        height: 44px;
    }

    .stats-search .form-control {
        height: 44px;
        min-height: 0;
        margin: 0;
        padding: 0 2.6rem 0 2.6rem;
        font-size: var(--fs-sm);
        line-height: 44px;
        border-radius: 999px;
    }

    /* Icon and clear button are centered on the input's own box. */
    .stats-search-icon,
    .stats-search-clear {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        z-index: 2;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        line-height: 1;
    }

    .stats-search-icon {
        left: 1rem;
        color: var(--text-muted);
        font-size: 0.85rem;
        pointer-events: none;
    }

    .stats-search-icon::before,
    .stats-search-clear i::before {
        display: block;
    }

    .stats-search-clear {
        right: 6px;
        width: 32px;
        height: 32px;
        padding: 0;
        border-radius: 50%;
        border: none;
        background: transparent;
        color: var(--text-muted);
        font-size: 0.8rem;
        cursor: pointer;
    }

    .stats-search-clear:hover {
        color: var(--gold-primary);
        background: var(--gold-subtle);
    }

    .stats-search-clear[hidden] {
        display: none;
    }

    /* ---------- Suggestions dropdown ---------- */
    #suggestionsList {
        top: 100%;
        left: 0;
        max-height: 340px;
        overflow-y: auto;
        z-index: 1000;
        border-radius: 16px;
        background: var(--card-bg-solid, #1a1a1a);
        border-color: var(--border-subtle, #333) !important;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
        padding-bottom: 0.35rem;
    }

    [data-theme="light"] #suggestionsList {
        background: #ffffff;
        border-color: #e5e1d8 !important;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
    }

    #suggestionsList .suggestion-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        padding: 0.55rem 1rem;
        cursor: pointer;
        color: var(--text-primary, #e5e5e5);
        font-size: var(--fs-sm);
        transition: background 0.15s;
    }

    [data-theme="light"] #suggestionsList .suggestion-item {
        color: #1f2937;
    }

    .suggestion-meta {
        flex-shrink: 0;
        font-size: 0.72rem;
        color: var(--text-muted);
        font-variant-numeric: tabular-nums;
    }

    .suggestion-empty {
        padding: 0.6rem 1rem;
        color: var(--text-muted);
        font-size: var(--fs-sm);
    }

    #suggestionsList .suggestion-divider {
        height: 1px;
        margin: 0.25rem 0;
        background: var(--border-subtle, #333);
    }

    .suggestion-sort {
        position: sticky;
        top: 0;
        z-index: 1;
        display: flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.6rem 0.75rem;
        background: inherit;
        border-bottom: 1px solid var(--border-subtle);
        overflow-x: auto;
        scrollbar-width: none;
    }

    .suggestion-sort::-webkit-scrollbar {
        display: none;
    }

    .suggestion-sort button {
        flex-shrink: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 28px;
        padding: 0 0.7rem;
        border-radius: 999px;
        border: 1px solid var(--border-subtle);
        background: transparent;
        color: var(--text-muted);
        font-size: 0.74rem;
        font-weight: 600;
        line-height: 1;
        white-space: nowrap;
        cursor: pointer;
    }

    .suggestion-sort button:hover {
        color: var(--gold-primary);
    }

    .suggestion-sort button.active {
        background: #D4AF37;
        border-color: #D4AF37;
        color: #141414;
    }

    /* ---------- Hero ---------- */
    /* Page title: same look the old "Progress" heading had. */
    .stats-hero-label {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        margin: 0;
        min-width: 0;
        font-family: 'Cormorant Garamond', serif;
        font-size: clamp(1.6rem, 5vw, 2.1rem);
        font-weight: 700;
        line-height: 1.1;
        letter-spacing: normal;
        color: var(--text-primary);
    }

    .stats-info-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        padding: 0;
        border: none;
        border-radius: 50%;
        background: transparent;
        color: var(--text-muted);
        font-family: inherit;
        font-size: 1rem;
        line-height: 1;
        cursor: pointer;
    }

    .stats-info-btn i::before {
        display: block;
    }

    .stats-info-btn:hover,
    .stats-info-btn[aria-expanded="true"] {
        color: var(--gold-primary);
    }

    .stats-hero-info {
        margin: 0.75rem 0 0;
        max-width: 60ch;
        font-size: var(--fs-sm);
        color: var(--text-muted);
        line-height: 1.5;
    }

    .stats-hero {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.4rem 1.25rem;
        margin: 1.1rem 0 1.4rem;
    }

    .stats-hero[hidden] {
        display: none;
    }

    .stats-hero-value {
        font-family: 'Cormorant Garamond', serif;
        font-weight: 700;
        font-size: clamp(3rem, 10vw, 4.4rem);
        line-height: 0.95;
        color: var(--stats-up);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
    }

    .stats-hero-value.is-down {
        color: var(--stats-down);
    }

    .stats-hero-value.is-flat {
        color: var(--text-primary);
    }

    .stats-hero-text {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 0.45rem;
        min-width: 0;
        flex: 1 1 180px;
    }

    .stats-hero-caption {
        font-size: var(--fs-base);
        line-height: 1.35;
        color: var(--text-secondary);
    }

    .stats-hero-change {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        font-size: var(--fs-sm);
        font-weight: 600;
        line-height: 1.2;
        color: var(--text-muted);
    }

    .stats-hero-change:empty {
        display: none;
    }

    .stats-hero-change i::before {
        display: block;
    }

    .stats-hero-change.is-up,
    .stats-hero-change.is-down {
        padding: 0.3rem 0.7rem;
        border-radius: 999px;
    }

    .stats-hero-change.is-up {
        color: var(--stats-up);
        background: var(--gold-subtle);
    }

    .stats-hero-change.is-down {
        color: var(--stats-down);
        background: rgba(239, 68, 68, 0.1);
    }

    .stats-hero[hidden] + .stats-chart-card {
        margin-top: 1.25rem;
    }

    /* ---------- Chart card ---------- */
    .stats-chart-card {
        background: var(--stats-surface);
        border: 1px solid var(--border-subtle);
        border-radius: 22px;
        padding: 14px 14px 10px;
    }

    [data-theme="light"] .stats-chart-card {
        border-color: rgba(148, 126, 86, 0.3);
    }

    .stats-chart-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.6rem;
        flex-wrap: wrap;
        margin-bottom: 0.5rem;
    }

    .stats-range {
        margin-left: auto;
        align-self: center;
    }

    .stats-chart-toolbar[hidden] {
        display: none;
    }

    .stats-segmented {
        display: inline-flex;
        gap: 2px;
        padding: 3px;
        border-radius: 999px;
        background: var(--stats-seg-bg);
    }

    .stats-segmented[hidden] {
        display: none;
    }

    .stats-segmented button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        line-height: 1;
        border: none;
        background: transparent;
        color: var(--text-muted);
        font-size: 0.78rem;
        font-weight: 600;
        padding: 0.4rem 0.8rem;
        min-height: 32px;
        min-width: 44px;
        border-radius: 999px;
        cursor: pointer;
        transition: background var(--transition-fast), color var(--transition-fast);
        white-space: nowrap;
    }

    .stats-segmented button:hover {
        color: var(--gold-primary);
    }

    .stats-segmented button.active {
        background: #D4AF37;
        color: #141414;
    }

    .stats-chart {
        position: relative;
        width: 100%;
        /* Sized so the whole chart fits under the header on a laptop screen. */
        height: clamp(240px, calc(100vh - 360px), 460px);
    }

    .stats-empty {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        color: var(--text-muted);
        font-size: var(--fs-sm);
        text-align: center;
        padding: 1rem;
    }

    .stats-empty[hidden] {
        display: none;
    }

    .stats-empty i {
        font-size: 1.6rem;
        color: var(--gold-primary);
        opacity: 0.6;
    }

    /* ---------- Tap details (touch) ---------- */
    /* Hover / tap box over the chart. On touch it is tappable and opens that workout. */
    .chart-tip {
        position: absolute;
        z-index: 5;
        max-width: 240px;
        padding: 10px 14px;
        border-radius: 12px;
        border: 1px solid rgba(212, 175, 55, 0.6);
        background: rgba(10, 10, 12, 0.94);
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
        line-height: 1.45;
        pointer-events: none;
    }
    .chart-tip[hidden] { display: none; }
    .chart-tip.is-touch { pointer-events: auto; cursor: pointer; }
    [data-theme="light"] .chart-tip { background: rgba(255, 251, 242, 0.98); border-color: rgba(166, 139, 91, 0.55); }
    .chart-tip-date { font-size: 0.74rem; font-weight: 600; color: var(--gold-primary); }
    .chart-tip-title { font-size: 0.74rem; color: var(--text-muted); }
    .chart-tip-title:empty, .chart-tip-set:empty { display: none; }
    .chart-tip-value { margin-top: 3px; font-size: 0.95rem; font-weight: 700; color: var(--text-primary); font-variant-numeric: tabular-nums; }
    .chart-tip-set { font-size: 0.78rem; color: var(--text-secondary); font-variant-numeric: tabular-nums; }

    /* ---------- Tiles ---------- */
    .stats-tiles {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 0.75rem;
        margin-top: 1rem;
    }

    .stats-tiles[hidden] {
        display: none;
    }

    .stats-tile {
        border: 1px solid var(--border-subtle);
        border-radius: 18px;
        padding: 1rem 1.1rem;
        background: var(--stats-surface);
        min-width: 0;
    }

    [data-theme="light"] .stats-tile {
        border-color: rgba(148, 126, 86, 0.3);
    }

    .stats-tile-label {
        font-size: 0.68rem;
        font-weight: 600;
        letter-spacing: 1.2px;
        text-transform: uppercase;
        color: var(--text-muted);
    }

    .stats-tile-value {
        margin-top: 0.3rem;
        font-size: clamp(1.15rem, 3.6vw, 1.5rem);
        font-weight: 700;
        color: var(--text-primary);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .stats-tile-sub {
        margin-top: 0.1rem;
        font-size: 0.78rem;
        color: var(--text-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    @media (max-width: 576px) {
        .stats-page {
            padding: 22px 20px;
        }

        .stats-header {
            gap: 1.1rem;
        }

        /* Tiles: slim stacked rows, label left, value + detail on one line right. */
        .stats-tiles {
            grid-template-columns: 1fr;
            gap: 0;
            margin-top: 1.1rem;
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            background: var(--stats-surface);
            overflow: hidden;
        }

        [data-theme="light"] .stats-tiles {
            border-color: rgba(148, 126, 86, 0.3);
        }

        .stats-tile,
        [data-theme="light"] .stats-tile {
            display: flex;
            align-items: baseline;
            gap: 0.5rem;
            border: none;
            border-radius: 0;
            background: transparent;
            padding: 0.8rem 1rem;
        }

        .stats-tile + .stats-tile {
            border-top: 1px solid var(--border-subtle);
        }

        .stats-tile-label {
            flex: 1;
            font-size: 0.65rem;
        }

        .stats-tile-value {
            margin-top: 0;
            font-size: 1.05rem;
        }

        .stats-tile-sub {
            margin-top: 0;
            font-size: 0.75rem;
        }

        .stats-back-home {
            display: none;
        }

        .suggestion-sort {
            gap: 0.25rem;
            padding: 0.55rem 0.5rem;
        }

        .suggestion-sort button {
            flex: 1 1 auto;
            padding: 0 0.4rem;
            font-size: 0.7rem;
        }

        /* Phone: search first, full width; label sits under it. */
        .stats-search {
            flex: 1 1 100%;
            order: -1;
        }

        .stats-hero {
            margin: 0.9rem 0 1.25rem;
            gap: 1.1rem 0.9rem;
        }

        .stats-hero-value {
            font-size: 3rem;
        }

        /* Caption stays beside the number unless the number is very wide. */
        .stats-hero-text {
            flex: 1 1 190px;
            gap: 0.35rem;
        }

        .stats-hero-caption {
            font-size: var(--fs-sm);
            line-height: 1.3;
        }

        .stats-hero-change {
            font-size: 0.8rem;
        }

        /* Landscape-shaped chart: wider than tall. */
        .stats-chart {
            height: clamp(200px, 60vw, 270px);
        }

        .stats-chart-card {
            padding: 16px 12px 8px;
            border-radius: 20px;
        }

        .stats-chart-toolbar {
            flex-direction: column;
            align-items: stretch;
        }

        .stats-segmented {
            display: flex;
        }

        .stats-segmented button {
            flex: 1;
            min-width: 0;
            min-height: 30px;
            padding: 0.3rem 0.3rem;
            font-size: 0.76rem;
        }

        .stats-range {
            margin-left: 0;
            flex: 1 1 100%;
        }

    }
</style>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
    // Headline = average of the last N days. Fixed (not tied to the time range) so it stays
    // the same whichever range you look at.
    const OVERALL_TREND_DAYS = 14;
    // Chart line smoothing (days) by how many days are on screen. Phones squeeze the same
    // days into fewer pixels, so they get a wider window to keep the line smooth.
    const SMOOTHING_WINDOWS = [
        { maxSpan: 31, desktop: 5, phone: 7 },
        { maxSpan: 92, desktop: 7, phone: 14 },
        { maxSpan: 183, desktop: 14, phone: 21 },
        { maxSpan: 366, desktop: 21, phone: 30 },
        { maxSpan: Infinity, desktop: 30, phone: 45 },
    ];
    const PHONE_CHART_WIDTH = 500;
    const BREAK_GAP_DAYS = 45;
    const RANGE_PHRASES = {
        '30': 'in the last month',
        '90': 'in the last 3 months',
        '180': 'in the last 6 months',
        '365': 'in the last year',
    };
    const RANGE_SHORT = {
        '30': 'last month',
        '90': 'last 3 months',
        '180': 'last 6 months',
        '365': 'last year',
        'all': 'all time',
    };

    let myChart = null;

    const exerciseOptionsEl = document.getElementById('exerciseOptionsData');
    let exerciseOptions = exerciseOptionsEl ? JSON.parse(exerciseOptionsEl.textContent || '[]') : [];
    const initialExerciseEl = document.getElementById('initialExerciseData');
    const initialExercise = initialExerciseEl ? JSON.parse(initialExerciseEl.textContent || '{}') : {};
    let currentExercise = '';
    let selectedSuggestionIndex = -1;
    // Saved on the account, so the last sort and range follow the user across devices.
    const statsPreferencesEl = document.getElementById('statsPreferencesData');
    const statsPreferences = statsPreferencesEl ? JSON.parse(statsPreferencesEl.textContent || '{}') : {};
    let currentRange = (statsPreferences.range === 'all' || RANGE_PHRASES[statsPreferences.range]) ? statsPreferences.range : 'all';
    let currentMetric = 'e1rm';
    let sortMode = statsPreferences.sort_mode || 'most_viewed';
    let fullChartData = null;
    let aiAssistantSelectedDate = '';

    function saveStatsPreference(fields) {
        const csrfToken = document.querySelector('meta[name="csrf-token"]')?.content || '';
        fetch('/stats/preferences', {
            method: 'POST',
            credentials: 'same-origin',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8',
                'X-CSRFToken': csrfToken,
            },
            body: new URLSearchParams(fields).toString(),
        }).catch(error => console.error('Error saving stats preference:', error));
    }

    // Draws the "Start" line (100 = where you started) for the overall view.
    const baselinePlugin = {
        id: 'startBaseline',
        beforeDatasetsDraw(chart) {
            if (!chart || !chart.$showBaseline) return;
            const yScale = chart.scales && chart.scales.y;
            const area = chart.chartArea;
            if (!yScale || !area) return;
            const y = yScale.getPixelForValue(100);
            if (!Number.isFinite(y) || y < area.top || y > area.bottom) return;
            const ctx = chart.ctx;
            ctx.save();
            ctx.strokeStyle = chart.$baselineStroke || 'rgba(148, 163, 184, 0.35)';
            ctx.lineWidth = 1.5;
            ctx.setLineDash([5, 4]);
            ctx.beginPath();
            ctx.moveTo(area.left, y);
            ctx.lineTo(area.right, y);
            ctx.stroke();
            ctx.restore();
        }
    };

    // Marks where the line ends: a faint dashed guide to the y-axis and a gold value pill there.
    const currentMarkerPlugin = {
        id: 'currentMarker',
        afterDatasetsDraw(chart) {
            const marker = chart && chart.$marker;
            const yScale = chart.scales && chart.scales.y;
            const area = chart.chartArea;
            if (!marker || !yScale || !area) return;
            const y = yScale.getPixelForValue(marker.value);
            if (!Number.isFinite(y) || y < area.top - 1 || y > area.bottom + 1) return;
            const point = chart.getDatasetMeta(marker.datasetIndex).data[marker.index];
            const xEnd = point && Number.isFinite(point.x) ? point.x : area.right;

            const ctx = chart.ctx;
            ctx.save();
            ctx.strokeStyle = marker.lineColor;
            ctx.lineWidth = 1;
            ctx.setLineDash([3, 4]);
            ctx.beginPath();
            ctx.moveTo(area.left, y);
            ctx.lineTo(xEnd, y);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.font = marker.font;
            const padX = marker.padX;
            const h = marker.height;
            const w = ctx.measureText(marker.text).width + padX * 2;
            const x = Math.max(2, area.left - 8 - w);
            const top = Math.min(area.bottom - h / 2, Math.max(area.top - h / 2, y - h / 2));
            ctx.beginPath();
            if (typeof ctx.roundRect === 'function') ctx.roundRect(x, top, w, h, h / 2);
            else ctx.rect(x, top, w, h);
            ctx.shadowColor = marker.glow;
            ctx.shadowBlur = 10;
            ctx.fillStyle = marker.background;
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = marker.border;
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.fillStyle = marker.color;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(marker.text, x + w / 2, top + h / 2 + 0.5);
            ctx.restore();
        }
    };
    // Smaller pill on phones so the y-axis doesn't eat into a narrow chart.
    const markerStyle = (phone) => ({
        font: `700 ${phone ? 10 : 11}px Inter, system-ui, -apple-system, sans-serif`,
        padX: phone ? 5 : 7,
        height: phone ? 18 : 20,
    });

    function isLightTheme() {
        return document.documentElement.getAttribute('data-theme') === 'light';
    }

    function formatDateLabel(rawLabel, options) {
        if (!rawLabel) return '';
        const dt = parseISODate(rawLabel);
        return dt ? dt.toLocaleDateString('en-US', options) : rawLabel;
    }

    const longDate = (raw) => formatDateLabel(raw, { month: 'short', day: 'numeric', year: 'numeric' });
    // "Aug 22" this year, "Aug 22, 2025" otherwise.
    const shortDate = (raw) => {
        const dt = parseISODate(raw);
        if (!dt || dt.getFullYear() !== new Date().getFullYear()) return longDate(raw);
        return formatDateLabel(raw, { month: 'short', day: 'numeric' });
    };

    function parseISODate(label) {
        const parts = String(label || '').split('-');
        if (parts.length !== 3) return null;
        const [year, month, day] = parts.map(Number);
        if (!Number.isFinite(year) || !Number.isFinite(month) || !Number.isFinite(day)) return null;
        const dt = new Date(year, month - 1, day);
        return Number.isNaN(dt.getTime()) ? null : dt;
    }

    // Whole days since epoch; used for date math without timezone surprises.
    function dayNumber(label) {
        const parts = String(label || '').split('-').map(Number);
        if (parts.length !== 3 || parts.some(n => !Number.isFinite(n))) return null;
        return Math.round(Date.UTC(parts[0], parts[1] - 1, parts[2]) / 86400000);
    }

    function isFiniteNumber(v) {
        return v !== null && v !== undefined && Number.isFinite(Number(v));
    }

    function formatNumber(raw) {
        const num = Number(raw);
        if (!Number.isFinite(num)) return '-';
        const abs = Math.abs(num);
        if (abs >= 1000) return Math.round(num).toLocaleString('en-US');
        if (abs >= 100) return String(Math.round(num));
        return String(Number(num.toFixed(1)));
    }

    // Overall index is stored as 100 = starting strength; users see it as change vs. start.
    function formatVsStart(raw, decimals = 1) {
        const num = Number(raw);
        if (!Number.isFinite(num)) return '-';
        const diff = Number((num - 100).toFixed(decimals));
        if (diff === 0) return '0%';
        const text = Math.abs(diff).toFixed(decimals).replace(/\.0+$/, '');
        return `${diff > 0 ? '+' : '−'}${text}%`;
    }

    function formatPercentChange(pct) {
        const abs = Math.abs(pct);
        return `${abs >= 10 ? Math.round(abs) : Number(abs.toFixed(1))}%`;
    }

    function getMetricInfo(metricKey, data) {
        const isTimed = !!(data && data.is_timed);
        const infos = {
            e1rm: {
                key: 'e1rm',
                name: isTimed ? 'Score' : 'Est. max',
                caption: isTimed ? 'timed score, latest session' : 'estimated max, latest session',
                unit: isTimed ? '' : 'kg',
                info: isTimed
                    ? 'A score combining weight and time from your best set each session.'
                    : 'The heaviest single rep you could likely lift, estimated from your best set each session.',
            },
            top_weight: {
                key: 'top_weight',
                name: 'Heaviest',
                caption: 'heaviest weight, latest session',
                unit: 'kg',
                info: 'The heaviest weight you used each session.',
            },
            tonnage: {
                key: 'tonnage',
                name: isTimed ? 'Total work' : 'Volume',
                caption: isTimed ? 'total work, latest session' : 'total volume, latest session',
                unit: isTimed ? 'kg·s' : 'kg',
                info: isTimed
                    ? 'Weight × seconds across all sets each session.'
                    : 'Weight × reps across all sets each session.',
            },
        };
        return infos[metricKey] || infos.e1rm;
    }

    function withUnit(value, unit) {
        const text = formatNumber(value);
        return unit ? `${text} ${unit}` : text;
    }

    // For each point, average the values from the last `windowDays` days (gaps skipped).
    function trailingAverageByDate(labels, values, windowDays) {
        const days = labels.map(dayNumber);
        const out = new Array(values.length).fill(null);
        let lo = 0;
        let sum = 0;
        let count = 0;
        for (let i = 0; i < values.length; i++) {
            if (isFiniteNumber(values[i])) { sum += Number(values[i]); count += 1; }
            while (lo < i && days[lo] !== null && days[i] !== null && days[lo] <= days[i] - windowDays) {
                if (isFiniteNumber(values[lo])) { sum -= Number(values[lo]); count -= 1; }
                lo += 1;
            }
            if (isFiniteNumber(values[i]) && count > 0) out[i] = sum / count;
        }
        return out;
    }

    function isPhoneChart() {
        const box = document.getElementById('progressChart').parentElement;
        return (box ? box.clientWidth : window.innerWidth) < PHONE_CHART_WIDTH;
    }

    function smoothingWindowFor(spanDays) {
        const row = SMOOTHING_WINDOWS.find(r => spanDays <= r.maxSpan) || SMOOTHING_WINDOWS[SMOOTHING_WINDOWS.length - 1];
        return isPhoneChart() ? row.phone : row.desktop;
    }

    // Centered moving average: each point averages `windowDays` around it, so the line runs
    // through the middle of the dots instead of trailing behind them. Near the right edge there
    // are no future days, so the window blends into the headline's trailing N-day average;
    // the line therefore ends exactly on the headline number.
    function centeredAverageByDate(labels, values, windowDays, endTrailingDays) {
        const days = labels.map(dayNumber);
        const n = values.length;
        const sums = new Array(n + 1).fill(0);
        const counts = new Array(n + 1).fill(0);
        for (let i = 0; i < n; i++) {
            const ok = isFiniteNumber(values[i]);
            sums[i + 1] = sums[i] + (ok ? Number(values[i]) : 0);
            counts[i + 1] = counts[i] + (ok ? 1 : 0);
        }
        // First index whose day is greater than `target` (days are ascending).
        const firstAfter = (target) => {
            let lo = 0;
            let hi = n;
            while (lo < hi) {
                const mid = (lo + hi) >> 1;
                if (days[mid] > target) hi = mid; else lo = mid + 1;
            }
            return lo;
        };
        const lastDay = days[n - 1];
        const half = windowDays / 2;
        const blendSpan = Math.max(half, endTrailingDays);
        return values.map((v, i) => {
            if (!isFiniteNumber(v) || days[i] === null) return null;
            const toEnd = lastDay - days[i];
            const blend = Math.min(1, toEnd / blendSpan);  // 1 = interior, 0 = last day
            const after = Math.min(half, toEnd);
            const before = half * blend + endTrailingDays * (1 - blend);
            const lo = firstAfter(days[i] - before);
            const hi = firstAfter(days[i] + after);
            const count = counts[hi] - counts[lo];
            return count > 0 ? (sums[hi] - sums[lo]) / count : Number(v);
        });
    }

    function getRangeStartIndex(labels, range) {
        if (!labels.length || range === 'all') return 0;
        const days = Number(range);
        const lastDay = dayNumber(labels[labels.length - 1]);
        if (!Number.isFinite(days) || lastDay === null) return 0;
        const cutoff = lastDay - days + 1;
        const idx = labels.findIndex(label => {
            const d = dayNumber(label);
            return d !== null && d >= cutoff;
        });
        return idx < 0 ? 0 : idx;
    }

    function lastFiniteIndex(values, from = values.length - 1) {
        for (let i = from; i >= 0; i--) {
            if (isFiniteNumber(values[i])) return i;
        }
        return null;
    }

    function firstFiniteIndex(values, from = 0) {
        for (let i = from; i < values.length; i++) {
            if (isFiniteNumber(values[i])) return i;
        }
        return null;
    }

    // How the chart was last touched: 'mouse' opens a point on click; touch/pen show a tappable box.
    let chartPointerType = 'mouse';
    let openChartTipPoint = null;

    function hideChartTip() {
        const tip = document.getElementById('chartTip');
        if (tip) tip.hidden = true;
        if (myChart && myChart.tooltip) {
            myChart.tooltip.setActiveElements([], { x: 0, y: 0 });
            myChart.update('none');
        }
    }

    function normalizeSearchValue(value) {
        return String(value || '')
            .toLowerCase()
            .replace(/[-–—]+/g, ' ')
            .replace(/[^a-z0-9\s]+/g, ' ')
            .replace(/\s+/g, ' ')
            .trim();
    }

    if (exerciseOptions.length) {
        const seenOptionKeys = new Set();
        exerciseOptions = exerciseOptions.filter(option => {
            const key = normalizeSearchValue(option.label || option.value);
            if (!key || seenOptionKeys.has(key)) {
                return false;
            }
            seenOptionKeys.add(key);
            return true;
        });
    }

    function hasBooleanOperators(query) {
        if (!query) return false;
        if (/\b(?:and|or|not)\b/i.test(query)) return true;
        if (/[()+*!]/.test(query)) return true;
        if (/(^|\s)-\w/.test(query) || /\s-\s/.test(query)) return true;
        return false;
    }

    function tokenizeBooleanQuery(query) {
        const raw = String(query || '').trim();
        if (!raw) return [];
        const prepared = raw
            .replace(/([()])/g, ' $1 ')
            .replace(/([+*])/g, ' $1 ')
            .replace(/!/g, ' ! ')
            .replace(/\s+/g, ' ')
            .trim();
        const parts = prepared ? prepared.split(' ') : [];
        const tokens = [];

        parts.forEach((part) => {
            if (!part) return;
            const lower = part.toLowerCase();
            if (lower === 'and' || lower === '+') {
                tokens.push({ type: 'OP', value: 'AND' });
                return;
            }
            if (lower === 'or') {
                tokens.push({ type: 'OP', value: 'OR' });
                return;
            }
            if (lower === 'not' || lower === '!' || lower === '-') {
                tokens.push({ type: 'OP', value: 'NOT' });
                return;
            }
            if (lower === '*' ) {
                tokens.push({ type: 'OP', value: 'AND' });
                return;
            }
            if (part === '(') {
                tokens.push({ type: 'LPAREN' });
                return;
            }
            if (part === ')') {
                tokens.push({ type: 'RPAREN' });
                return;
            }
            if (part.startsWith('-') && part.length > 1) {
                tokens.push({ type: 'OP', value: 'NOT' });
                tokens.push({ type: 'TERM', value: part.slice(1).toLowerCase() });
                return;
            }
            if (part.startsWith('!') && part.length > 1) {
                tokens.push({ type: 'OP', value: 'NOT' });
                tokens.push({ type: 'TERM', value: part.slice(1).toLowerCase() });
                return;
            }
            tokens.push({ type: 'TERM', value: part.toLowerCase() });
        });

        return tokens;
    }

    function insertImplicitAnd(tokens) {
        const result = [];
        const isTerm = (token) => token && token.type === 'TERM';
        const isRightGroup = (token) => token && (token.type === 'TERM' || token.type === 'LPAREN' || (token.type === 'OP' && token.value === 'NOT'));
        const isLeftGroup = (token) => token && (token.type === 'TERM' || token.type === 'RPAREN');

        tokens.forEach((token, idx) => {
            const prev = result[result.length - 1];
            if (idx > 0 && isLeftGroup(prev) && isRightGroup(token)) {
                result.push({ type: 'OP', value: 'AND' });
            }
            result.push(token);
        });
        return result;
    }

    function toRpn(tokens) {
        const output = [];
        const ops = [];
        const prec = { OR: 1, AND: 2, NOT: 3 };
        const rightAssoc = { NOT: true };

        for (const token of tokens) {
            if (token.type === 'TERM') {
                output.push(token);
                continue;
            }
            if (token.type === 'OP') {
                while (ops.length) {
                    const top = ops[ops.length - 1];
                    if (top.type !== 'OP') break;
                    const topPrec = prec[top.value] || 0;
                    const curPrec = prec[token.value] || 0;
                    if ((rightAssoc[token.value] && curPrec < topPrec) || (!rightAssoc[token.value] && curPrec <= topPrec)) {
                        output.push(ops.pop());
                        continue;
                    }
                    break;
                }
                ops.push(token);
                continue;
            }
            if (token.type === 'LPAREN') {
                ops.push(token);
                continue;
            }
            if (token.type === 'RPAREN') {
                while (ops.length && ops[ops.length - 1].type !== 'LPAREN') {
                    output.push(ops.pop());
                }
                if (!ops.length) return null;
                ops.pop();
            }
        }

        while (ops.length) {
            const op = ops.pop();
            if (op.type === 'LPAREN' || op.type === 'RPAREN') return null;
            output.push(op);
        }
        return output;
    }

    function evalRpn(rpn, text) {
        const stack = [];
        for (const token of rpn) {
            if (token.type === 'TERM') {
                stack.push(text.includes(token.value));
                continue;
            }
            if (token.type === 'OP') {
                if (token.value === 'NOT') {
                    if (!stack.length) return false;
                    stack.push(!stack.pop());
                    continue;
                }
                if (stack.length < 2) return false;
                const b = stack.pop();
                const a = stack.pop();
                stack.push(token.value === 'AND' ? (a && b) : (a || b));
            }
        }
        return stack.length ? stack[0] : false;
    }

    function buildBooleanMatcher(query) {
        const tokens = insertImplicitAnd(tokenizeBooleanQuery(query));
        if (!tokens.length) return null;
        if (!tokens.some(token => token.type === 'TERM')) return null;
        const rpn = toRpn(tokens);
        if (!rpn) return null;
        return (value) => evalRpn(rpn, value);
    }

    function getFilteredOptions(filterText) {
        const normalized = normalizeSearchValue(filterText);
        if (!normalized) return exerciseOptions;
        if (!hasBooleanOperators(filterText)) {
            return exerciseOptions.filter(option =>
                normalizeSearchValue(option.label || option.value).includes(normalized)
            );
        }

        const matcher = buildBooleanMatcher(filterText);
        if (!matcher) {
            return exerciseOptions.filter(option => 
                normalizeSearchValue(option.label || option.value).includes(normalized)
            );
        }
        return exerciseOptions.filter(option => {
            const haystack = (option.label || option.value || '').toLowerCase();
            return matcher(haystack);
        });
    }

    const SORT_OPTIONS = [
        { mode: 'most_viewed', label: 'Viewed' },
        { mode: 'most_trained', label: 'Frequent' },
        { mode: 'recently_trained', label: 'Recent' },
        { mode: 'alpha_asc', label: 'A–Z' },
        { mode: 'alpha_desc', label: 'Z–A' },
    ];

    function sortOptionsList(options) {
        const byName = (a, b) => String(a.label || a.value).localeCompare(String(b.label || b.value), undefined, { sensitivity: 'base' });
        const sorted = [...options];
        if (sortMode === 'alpha_desc') return sorted.sort((a, b) => byName(b, a));
        if (sortMode === 'alpha_asc') return sorted.sort(byName);
        if (sortMode === 'most_viewed') {
            // Never-viewed exercises fall back to "Frequent" order.
            return sorted.sort((a, b) => (b.views || 0) - (a.views || 0) || (b.sessions || 0) - (a.sessions || 0) || byName(a, b));
        }
        if (sortMode === 'recently_trained') {
            return sorted.sort((a, b) => String(b.last || '').localeCompare(String(a.last || '')) || (b.sessions || 0) - (a.sessions || 0) || byName(a, b));
        }
        return sorted.sort((a, b) => (b.sessions || 0) - (a.sessions || 0) || String(b.last || '').localeCompare(String(a.last || '')) || byName(a, b));
    }

    function suggestionMeta(option) {
        if (sortMode === 'recently_trained') return option.last ? shortDate(option.last) : '';
        if (sortMode === 'most_viewed') {
            const views = Number(option.views) || 0;
            return views ? `${views} view${views === 1 ? '' : 's'}` : '';
        }
        if (sortMode === 'most_trained') {
            const n = Number(option.sessions) || 0;
            return `${n} session${n === 1 ? '' : 's'}`;
        }
        return '';
    }

    function buildSortBar() {
        const bar = document.createElement('div');
        bar.className = 'suggestion-sort';
        bar.setAttribute('role', 'group');
        bar.setAttribute('aria-label', 'Sort exercises');
        SORT_OPTIONS.forEach(({ mode, label: text }) => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.textContent = text;
            btn.classList.toggle('active', mode === sortMode);
            btn.setAttribute('aria-pressed', String(mode === sortMode));
            // Keep focus in the search box so the list stays open.
            btn.addEventListener('mousedown', (event) => event.preventDefault());
            btn.addEventListener('click', (event) => {
                event.stopPropagation();
                if (mode === sortMode) return;
                sortMode = mode;
                saveStatsPreference({ sort_mode: mode });
                const input = document.getElementById('exerciseSearch');
                renderSuggestions(input ? input.value : '');
            });
            bar.appendChild(btn);
        });
        return bar;
    }

    function renderSuggestions(filterText = '') {
        const suggestionsList = document.getElementById('suggestionsList');
        if (!suggestionsList) return;

        // When an exercise is picked, the box shows its name; list everything again.
        const selectedOption = exerciseOptions.find(opt => opt.value === currentExercise);
        const query = (selectedOption && filterText === (selectedOption.label || selectedOption.value)) ? '' : filterText;
        const filtered = sortOptionsList(getFilteredOptions(query));
        suggestionsList.replaceChildren(buildSortBar());

        const addItem = (index, onSelect, build) => {
            const item = document.createElement('div');
            item.className = 'suggestion-item';
            item.dataset.index = String(index);
            build(item);
            item.onmouseover = () => { item.style.background = 'rgba(212, 175, 55, 0.18)'; };
            item.onmouseout = () => { if (selectedSuggestionIndex !== index) item.style.background = 'transparent'; };
            item.onclick = onSelect;
            suggestionsList.appendChild(item);
        };

        const showOverall = !query.trim();
        if (showOverall) {
            addItem(0, () => selectExercise(''), (item) => {
                item.innerHTML = '<span><i class="bi bi-graph-up me-2 text-gold"></i><span class="fw-semibold">Overall strength</span></span>';
            });
            if (filtered.length) {
                const divider = document.createElement('div');
                divider.className = 'suggestion-divider';
                suggestionsList.appendChild(divider);
            }
        }

        const startIdx = showOverall ? 1 : 0;
        filtered.forEach((option, idx) => {
            addItem(idx + startIdx, () => selectExercise(option.value), (item) => {
                const name = document.createElement('span');
                name.textContent = option.label || option.value;
                item.appendChild(name);
                const metaText = suggestionMeta(option);
                if (metaText) {
                    const meta = document.createElement('span');
                    meta.className = 'suggestion-meta';
                    meta.textContent = metaText;
                    item.appendChild(meta);
                }
            });
        });

        if (filtered.length === 0 && query.trim()) {
            const noResults = document.createElement('div');
            noResults.className = 'suggestion-empty';
            noResults.textContent = 'No exercises found';
            suggestionsList.appendChild(noResults);
        }

        selectedSuggestionIndex = -1;
    }

    function showSuggestions() {
        const suggestionsList = document.getElementById('suggestionsList');
        if (suggestionsList) {
            if (suggestionsList.style.display === 'none') {
                const input = document.getElementById('exerciseSearch');
                renderSuggestions(input ? input.value : '');
            }
            suggestionsList.style.display = 'block';
            selectedSuggestionIndex = -1;
        }
    }

    function hideSuggestions() {
        setTimeout(() => {
            const suggestionsList = document.getElementById('suggestionsList');
            if (suggestionsList) {
                suggestionsList.style.display = 'none';
            }
        }, 200);
    }

    function selectExercise(exerciseValue) {
        const searchInput = document.getElementById('exerciseSearch');
        currentExercise = exerciseValue;
        
        if (exerciseValue) {
            const option = exerciseOptions.find(opt => opt.value === exerciseValue);
            if (searchInput && option) {
                searchInput.value = option.label || option.value;
            }
        } else {
            if (searchInput) {
                searchInput.value = '';
            }
        }
        
        hideSuggestions();
        loadChart();
    }

    function handleSearchInput() {
        const searchInput = document.getElementById('exerciseSearch');
        const filterText = searchInput ? searchInput.value : '';
        renderSuggestions(filterText);
        showSuggestions();
        syncClearButton();
        
        // Auto-select if exact match or single result
        const filtered = getFilteredOptions(filterText);
        if (filtered.length === 1) {
            currentExercise = filtered[0].value;
            loadChart();
        } else if (filterText.trim() === '') {
            currentExercise = '';
            loadChart();
        }
    }

    function handleKeyDown(event) {
        const suggestionsList = document.getElementById('suggestionsList');
        if (!suggestionsList || suggestionsList.style.display === 'none') return;
        
        const items = suggestionsList.querySelectorAll('.suggestion-item');
        if (items.length === 0) return;
        
        if (event.key === 'ArrowDown') {
            event.preventDefault();
            selectedSuggestionIndex = (selectedSuggestionIndex + 1) % items.length;
            updateSelectedSuggestion(items);
        } else if (event.key === 'ArrowUp') {
            event.preventDefault();
            selectedSuggestionIndex = selectedSuggestionIndex <= 0 ? items.length - 1 : selectedSuggestionIndex - 1;
            updateSelectedSuggestion(items);
        } else if (event.key === 'Enter') {
            event.preventDefault();
            if (selectedSuggestionIndex >= 0 && selectedSuggestionIndex < items.length) {
                items[selectedSuggestionIndex].click();
            }
        } else if (event.key === 'Escape') {
            hideSuggestions();
        }
    }

    function updateSelectedSuggestion(items) {
        items.forEach((item, idx) => {
            if (idx === selectedSuggestionIndex) {
                item.style.background = 'rgba(212, 175, 55, 0.25)';
                item.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            } else {
                item.style.background = 'transparent';
            }
        });
    }

    // Close suggestions when clicking outside
    document.addEventListener('click', (e) => {
        const searchInput = document.getElementById('exerciseSearch');
        const suggestionsList = document.getElementById('suggestionsList');
        if (searchInput && suggestionsList && !searchInput.contains(e.target) && !suggestionsList.contains(e.target)) {
            hideSuggestions();
            selectedSuggestionIndex = -1;
        }
    });

    function syncClearButton() {
        const btn = document.getElementById('exerciseClear');
        const input = document.getElementById('exerciseSearch');
        if (!btn) return;
        btn.hidden = !(currentExercise || (input && input.value.trim()));
    }

    function syncActivePills() {
        document.querySelectorAll('.range-pill').forEach(b => {
            b.classList.toggle('active', b.dataset.range === currentRange);
        });
        document.querySelectorAll('.metric-pill').forEach(b => {
            b.classList.toggle('active', b.dataset.metric === currentMetric);
        });
    }

    function setText(id, text) {
        const el = document.getElementById(id);
        if (el) el.textContent = text;
    }

    function setTile(n, label, value, sub) {
        setText(`tile${n}Label`, label);
        setText(`tile${n}Value`, value);
        setText(`tile${n}Sub`, sub || '');
    }

    function showEmptyState(show) {
        document.getElementById('chartEmpty').hidden = !show;
        document.getElementById('progressChart').style.visibility = show ? 'hidden' : 'visible';
        if (show) {
            document.getElementById('statsHero').hidden = true;
            document.getElementById('statsTiles').hidden = true;
        }
    }

    function topSetText(data, idx) {
        const weight = (data && Array.isArray(data.weight)) ? Number(data.weight[idx]) : NaN;
        const reps = (data && Array.isArray(data.reps)) ? Number(data.reps[idx]) : NaN;
        if (!(weight > 0) || !(reps > 0)) return '';
        return `${formatNumber(weight)} kg × ${Math.round(reps)}${data.is_timed ? 's' : ''}`;
    }

    function updateHero(view) {
        const hero = document.getElementById('statsHero');
        const valueEl = document.getElementById('heroValue');
        const changeEl = document.getElementById('heroChange');
        const infoEl = document.getElementById('heroInfo');
        const { isOverall, labels, values, trend, startIdx, metricInfo } = view;

        const endIdx = lastFiniteIndex(trend);
        if (endIdx === null) { hero.hidden = true; return; }

        valueEl.classList.remove('is-up', 'is-down', 'is-flat');
        changeEl.classList.remove('is-up', 'is-down');

        const startLabel = formatDateLabel(labels[firstFiniteIndex(values)], { month: 'short', year: 'numeric' });
        const onAll = currentRange === 'all';

        if (isOverall) {
            setText('heroLabel', 'Overall strength');
            infoEl.textContent = 'Your estimated max on every exercise, compared with your first few sessions of it. 0% is where you started. Bigger lifts count more, and exercises you stop doing fade out after 2–3 months.';
            const diff = trend[endIdx] - 100;
            const pctText = formatPercentChange(diff);
            if (diff >= 0.5) {
                valueEl.textContent = `+${pctText}`;
                setText('heroCaption', onAll ? `stronger since ${startLabel}` : 'stronger than when you started');
            } else if (diff <= -0.5) {
                valueEl.textContent = `−${pctText}`;
                valueEl.classList.add('is-down');
                setText('heroCaption', onAll ? `below your ${startLabel} start` : 'below where you started');
            } else {
                valueEl.textContent = '0%';
                valueEl.classList.add('is-flat');
                setText('heroCaption', onAll ? `level with your ${startLabel} start` : 'right where you started');
            }
        } else {
            const option = exerciseOptions.find(opt => opt.value === currentExercise);
            setText('heroLabel', (option && option.label) || currentExercise);
            infoEl.textContent = metricInfo.info;
            const lastIdx = lastFiniteIndex(values);
            valueEl.textContent = withUnit(values[lastIdx], metricInfo.unit);
            valueEl.classList.add('is-flat');
            setText('heroCaption', metricInfo.caption);
        }

        // Change chip: how the line moved over the selected range.
        let fromIdx;
        if (currentRange === 'all') {
            fromIdx = firstFiniteIndex(trend);
        } else if (isOverall) {
            fromIdx = lastFiniteIndex(trend, startIdx) ?? firstFiniteIndex(trend, startIdx);
        } else {
            // First session in the range, or the one before it if the range only has the latest.
            fromIdx = firstFiniteIndex(trend, startIdx);
            if (fromIdx === null || fromIdx >= endIdx) fromIdx = startIdx > 0 ? lastFiniteIndex(trend, startIdx - 1) : null;
        }
        const period = currentRange === 'all'
            ? `since ${formatDateLabel(labels[fromIdx], { month: 'short', year: 'numeric' })}`
            : RANGE_PHRASES[currentRange];

        if (isOverall && currentRange === 'all') {
            // The headline is already "vs. when you started"; the caption says since when.
            changeEl.textContent = '';
        } else if (fromIdx === null || fromIdx >= endIdx) {
            changeEl.textContent = '';
        } else {
            const from = Number(trend[fromIdx]);
            const to = Number(trend[endIdx]);
            const pct = from > 0 ? ((to / from) - 1) * 100 : 0;
            if (Math.abs(pct) < 0.5) {
                changeEl.textContent = `Steady ${period}`;
            } else {
                const up = pct > 0;
                const amount = isOverall
                    ? formatPercentChange(pct)
                    : withUnit(Math.abs(to - from), metricInfo.unit);
                changeEl.classList.add(up ? 'is-up' : 'is-down');
                changeEl.innerHTML = `<i class="bi bi-arrow-${up ? 'up' : 'down'}-right"></i>`;
                changeEl.append(`${up ? 'Up' : 'Down'} ${amount} ${period}`);
            }
        }
        hero.hidden = false;
    }

    function updateTiles(view) {
        const { isOverall, data, labels, values, loggedIndices, startIdx, metricInfo } = view;
        const inRange = loggedIndices.filter(i => i >= startIdx && isFiniteNumber(values[i]));
        const tiles = document.getElementById('statsTiles');
        if (!inRange.length) { tiles.hidden = true; return; }

        const bestIdx = inRange.reduce((best, i) => (Number(values[i]) > Number(values[best]) ? i : best), inRange[0]);
        const rangeText = RANGE_SHORT[currentRange];

        if (isOverall) {
            setTile(1, 'Best', formatVsStart(values[bestIdx]), shortDate(labels[bestIdx]));
            setTile(2, 'Workouts', String(inRange.length), rangeText);
            const firstDay = dayNumber(labels[currentRange === 'all' ? inRange[0] : startIdx]);
            const lastDay = dayNumber(labels[labels.length - 1]);
            const weeks = Math.max(1, ((lastDay - firstDay) + 1) / 7);
            setTile(3, 'Per week', String(Number((inRange.length / weeks).toFixed(1))), 'on average');
        } else {
            setTile(1, 'Best', withUnit(values[bestIdx], metricInfo.unit), shortDate(labels[bestIdx]));
            const lastIdx = inRange[inRange.length - 1];
            // Weight as the value, reps under it, so it never wraps mid-set.
            const weight = Array.isArray(data.weight) ? Number(data.weight[lastIdx]) : NaN;
            const reps = Array.isArray(data.reps) ? Number(data.reps[lastIdx]) : NaN;
            if (weight > 0 && reps > 0) {
                const repsText = `× ${Math.round(reps)}${data.is_timed ? 's' : ''}`;
                setTile(2, 'Last session', withUnit(weight, 'kg'), `${repsText} · ${shortDate(labels[lastIdx])}`);
            } else {
                setTile(2, 'Last session', '-', shortDate(labels[lastIdx]));
            }
            setTile(3, 'Sessions', String(inRange.length), rangeText);
        }
        tiles.hidden = false;
    }

    function renderChart(data) {
        fullChartData = data;
        const staleTip = document.getElementById('chartTip');
        if (staleTip) staleTip.hidden = true;

        const isOverall = !currentExercise && data && data.unit === 'percent';
        const labels = (data && Array.isArray(data.labels)) ? data.labels : [];
        const metricInfo = getMetricInfo(currentMetric, data);

        document.getElementById('metricControls').hidden = isOverall;
        document.getElementById('chartToolbar').hidden = isOverall;
        document.querySelectorAll('.metric-pill').forEach(btn => {
            btn.textContent = getMetricInfo(btn.dataset.metric, data).name;
        });

        const rawValues = isOverall
            ? (data.data || [])
            : ((data.series && data.series[metricInfo.key]) || data.data || []);
        const values = rawValues.map(v => (isFiniteNumber(v) && Number(v) > 0) ? Number(v) : null);

        const workoutDays = new Set(Array.isArray(data.workout_days) ? data.workout_days : labels);
        const loggedIndices = [];
        labels.forEach((label, idx) => { if (workoutDays.has(label)) loggedIndices.push(idx); });
        const loggedIndexSet = new Set(loggedIndices);

        // During a long break the overall value only drifts as exercises fade out, which
        // isn't a real change in strength, so show the break as a gap instead.
        if (isOverall) {
            let lastWorkoutDay = null;
            labels.forEach((label, idx) => {
                const day = dayNumber(label);
                if (loggedIndexSet.has(idx)) lastWorkoutDay = day;
                else if (lastWorkoutDay !== null && day - lastWorkoutDay > BREAK_GAP_DAYS) values[idx] = null;
            });
        }

        if (!labels.length || firstFiniteIndex(values) === null) {
            showEmptyState(true);
            if (myChart) { myChart.destroy(); myChart = null; }
            return;
        }
        showEmptyState(false);

        const startIdx = getRangeStartIndex(labels, currentRange);
        const endIdx = labels.length - 1;
        const spanDays = dayNumber(labels[endIdx]) - dayNumber(labels[startIdx]) + 1;

        // The headline uses a fixed number (overall: 14-day average; exercise: latest session).
        // The chart line is smoothed more or less depending on the range and screen, and always
        // ends on that headline number.
        const trend = isOverall ? trailingAverageByDate(labels, values, OVERALL_TREND_DAYS) : values;
        const line = centeredAverageByDate(labels, values, smoothingWindowFor(spanDays), isOverall ? OVERALL_TREND_DAYS : 0);
        const view = { isOverall, data, labels, values, trend, startIdx, loggedIndices, metricInfo };

        updateHero(view);
        updateTiles(view);

        // Dots = individual workouts, line = trend.
        const dots = values.map((v, i) => (loggedIndexSet.has(i) ? v : null));
        const lastTrendIdx = lastFiniteIndex(line);

        const light = isLightTheme();
        const gold = '#D4AF37';
        // Few workouts on screen: bigger, outlined dots so they stand out from the line.
        const visibleWorkouts = loggedIndices.filter(i => i >= startIdx).length;
        const sparse = visibleWorkouts < 40;
        const dense = visibleWorkouts > 120;
        const dotRadius = sparse ? 4.5 : (dense ? (isPhoneChart() ? 1.6 : 2) : 3);
        const dotAlpha = dense && isPhoneChart() ? 0.28 : (light ? 0.45 : 0.4);
        const dotColor = sparse ? gold : (light ? `rgba(168, 132, 31, ${dotAlpha})` : `rgba(212, 175, 55, ${dotAlpha})`);
        const cardColor = light ? '#FFFAF1' : '#0F0F11';
        const tickColor = light ? '#6B7280' : '#9CA3AF';
        const gridColor = light ? 'rgba(148, 163, 184, 0.22)' : 'rgba(148, 163, 184, 0.12)';
        const ctx = document.getElementById('progressChart').getContext('2d');
        const gradient = ctx.createLinearGradient(0, 0, 0, 340);
        gradient.addColorStop(0, light ? 'rgba(212, 175, 55, 0.28)' : 'rgba(212, 175, 55, 0.3)');
        gradient.addColorStop(1, 'rgba(212, 175, 55, 0.02)');
        const belowStartFill = light ? 'rgba(220, 38, 38, 0.1)' : 'rgba(239, 68, 68, 0.14)';
        const trendFill = isOverall
            ? { target: { value: 100 }, above: gradient, below: belowStartFill }
            : { target: 'start', above: gradient, below: gradient };

        // The y-axis auto-fits the visible range; on "All" keep the Start line in view.
        const includeStart = isOverall && currentRange === 'all';

        const valueText = (v) => (isOverall ? `${formatVsStart(v)} vs. start` : withUnit(v, metricInfo.unit));

        const markerValue = lastTrendIdx !== null ? Number(line[lastTrendIdx]) : null;
        const markerText = markerValue === null ? '' : (isOverall ? formatVsStart(markerValue) : formatNumber(markerValue));
        const phone = isPhoneChart();
        const pill = markerStyle(phone);
        ctx.font = pill.font;
        const markerWidth = markerText ? ctx.measureText(markerText).width + pill.padX * 2 : 0;

        const yTick = function (value) {
            // Leave room for the marker pill: drop tick labels that would sit under it.
            if (markerValue !== null && Number.isFinite(this.height) && this.height > 0) {
                const pxPerUnit = this.height / Math.abs((this.max - this.min) || 1);
                if (Math.abs(Number(value) - markerValue) * pxPerUnit < 16) return '';
            }
            if (isOverall) return Math.abs(Number(value) - 100) < 1e-9 ? 'Start' : formatVsStart(value, 0);
            return formatNumber(value);
        };

        const workoutTitles = Array.isArray(data.workout_titles) ? data.workout_titles : [];

        const openPoint = (idx) => {
            if (!loggedIndexSet.has(idx)) return;
            const rawDate = labels[idx] || '';
            if (!rawDate) return;
            aiAssistantSelectedDate = rawDate;
            window.location.href = `/workout/${encodeURIComponent(rawDate)}`;
        };

        // Our own HTML box instead of the canvas-drawn tooltip, so it can be tapped on phones.
        const renderTip = ({ chart, tooltip }) => {
            const tip = document.getElementById('chartTip');
            if (!tip) return;
            const point = (tooltip.dataPoints || []).find(p => p.datasetIndex === 0 && isFiniteNumber(p.parsed.y));
            if (!tooltip.opacity || !point) {
                tip.hidden = true;
                return;
            }
            const idx = point.dataIndex;
            const title = String(workoutTitles[idx] || '').trim();
            tip.querySelector('.chart-tip-date').textContent = longDate(labels[idx]);
            tip.querySelector('.chart-tip-title').textContent = (!title || title.toLowerCase() === 'workout') ? '' : title;
            tip.querySelector('.chart-tip-value').textContent = valueText(point.parsed.y);
            const topSet = isOverall ? '' : topSetText(data, idx);
            tip.querySelector('.chart-tip-set').textContent = topSet ? `Top set: ${topSet}` : '';
            tip.dataset.index = String(idx);
            tip.classList.toggle('is-touch', chartPointerType !== 'mouse');
            tip.hidden = false;

            const box = chart.canvas.parentNode;
            const w = tip.offsetWidth;
            const h = tip.offsetHeight;
            const left = Math.max(0, Math.min(tooltip.caretX - w / 2, box.clientWidth - w));
            const top = tooltip.caretY - h - 14 >= 0 ? tooltip.caretY - h - 14 : tooltip.caretY + 16;
            tip.style.left = `${left}px`;
            tip.style.top = `${top}px`;
        };
        openChartTipPoint = openPoint;

        const onClick = (evt, elements) => {
            // Touch: a tap only moves the box to the nearest point; tapping the box opens it.
            if (chartPointerType !== 'mouse') return;
            const hit = (elements || []).find(el => el.datasetIndex === 0);
            if (hit) openPoint(hit.index);
        };

        // Over long spans "Apr 18" is ambiguous, so show month + year instead.
        const longSpan = dayNumber(labels[endIdx]) - dayNumber(labels[startIdx]) > 300;
        const xLabel = (l) => {
            if (!longSpan) return formatDateLabel(l, { month: 'short', day: 'numeric' });
            const dt = parseISODate(l);
            return dt ? `${dt.toLocaleDateString('en-US', { month: 'short' })} '${String(dt.getFullYear()).slice(-2)}` : l;
        };

        const maxTicks = window.innerWidth > 768 ? Math.min(Math.floor(window.innerWidth / 110), 10) : 4;

        const config = {
            type: 'line',
            plugins: [baselinePlugin, currentMarkerPlugin],
            data: {
                labels: labels.map(xLabel),
                datasets: [
                    {
                        label: 'Workouts',
                        data: dots,
                        order: 0,
                        showLine: false,
                        pointRadius: dotRadius,
                        pointHoverRadius: sparse ? 7 : 6,
                        pointHitRadius: 10,
                        pointBackgroundColor: dotColor,
                        pointBorderColor: cardColor,
                        pointBorderWidth: sparse ? 2 : 0,
                        pointHoverBackgroundColor: gold,
                        pointHoverBorderColor: cardColor,
                        pointHoverBorderWidth: sparse ? 2 : 0,
                    },
                    {
                        label: 'Trend',
                        data: line,
                        order: 1,
                        borderColor: gold,
                        borderWidth: phone ? 2 : 2.5,
                        cubicInterpolationMode: 'monotone',
                        fill: trendFill,
                        backgroundColor: gradient,
                        pointRadius: (c) => (c.dataIndex === lastTrendIdx ? 4.5 : 0),
                        pointBackgroundColor: gold,
                        pointBorderColor: cardColor,
                        pointBorderWidth: 2,
                        pointHoverRadius: 0,
                        pointHitRadius: 0,
                    },
                ],
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: { duration: 350 },
                interaction: { mode: 'nearest', axis: 'x', intersect: false },
                onClick,
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        enabled: false,
                        external: renderTip,
                        filter: (c) => c.datasetIndex === 0 && isFiniteNumber(c.parsed.y),
                    },
                },
                scales: {
                    y: {
                        suggestedMin: includeStart ? 100 : undefined,
                        suggestedMax: includeStart ? 100 : undefined,
                        grace: '5%',
                        grid: { color: gridColor, drawTicks: false },
                        border: { display: false },
                        ticks: { color: tickColor, font: { size: phone ? 10 : 11 }, padding: phone ? 6 : 8, maxTicksLimit: phone ? 5 : 6, callback: yTick },
                        afterFit: (scale) => { scale.width = Math.max(scale.width, markerWidth + (phone ? 8 : 12)); },
                    },
                    x: {
                        min: startIdx,
                        max: endIdx,
                        grid: { display: false },
                        border: { display: false },
                        ticks: { color: tickColor, font: { size: 11 }, padding: 6, autoSkip: true, maxTicksLimit: maxTicks, maxRotation: 0 },
                    },
                },
            },
        };

        if (myChart) myChart.destroy();
        lastPhoneLayout = isPhoneChart();
        myChart = new Chart(ctx, config);
        myChart.$showBaseline = isOverall;
        myChart.$baselineStroke = light ? 'rgba(107, 114, 128, 0.45)' : 'rgba(156, 163, 175, 0.4)';
        myChart.$marker = markerText ? {
            value: markerValue,
            index: lastTrendIdx,
            datasetIndex: 1,
            text: markerText,
            ...pill,
            color: light ? '#7A5B0C' : '#F4D03F',
            background: light ? '#FFF6DC' : '#1A160A',
            border: light ? 'rgba(168, 132, 31, 0.55)' : 'rgba(212, 175, 55, 0.7)',
            glow: light ? 'rgba(212, 175, 55, 0.35)' : 'rgba(212, 175, 55, 0.55)',
            lineColor: light ? 'rgba(168, 132, 31, 0.45)' : 'rgba(212, 175, 55, 0.4)',
        } : null;
        myChart.draw();
    }

    function loadAverageChart() {
        const params = new URLSearchParams({
            mode: 'index',
            baseline_sessions: '5',
            min_sessions: '3',
            fade_start_days: '60',
            fade_end_days: '90'
        });
        fetch(`/stats/data/average?${params.toString()}`)
            .then(response => response.json())
            .then(data => renderChart(data))
            .catch(error => console.error('Error loading average chart:', error));
    }

    function loadChart() {
        const exercise = currentExercise;
        const bwAlert = document.getElementById('bwStatsAlert');
        const bwLabel = document.getElementById('bwStatsExercise');
        const bwData = document.getElementById('bwExercisesData');
        const bwExercises = bwData ? JSON.parse(bwData.textContent || '[]') : [];

        syncClearButton();
        if (bwAlert) {
            const showBw = !!exercise && bwExercises.includes(exercise);
            if (showBw && bwLabel) bwLabel.textContent = exercise;
            bwAlert.style.display = showBw ? 'block' : 'none';
        }

        if (!exercise) {
            loadAverageChart();
            return;
        }

        fetch(`/stats/data/${encodeURIComponent(exercise)}`)
            .then(response => response.json())
            .then(data => renderChart(data))
            .catch(error => console.error('Error loading chart:', error));
    }

    document.querySelectorAll('.range-pill').forEach(btn => {
        btn.addEventListener('click', () => {
            currentRange = btn.dataset.range;
            saveStatsPreference({ range: currentRange });
            syncActivePills();
            if (fullChartData) renderChart(fullChartData);
        });
    });

    document.querySelectorAll('.metric-pill').forEach(btn => {
        btn.addEventListener('click', () => {
            currentMetric = btn.dataset.metric;
            syncActivePills();
            if (fullChartData) renderChart(fullChartData);
        });
    });

    document.getElementById('heroInfoBtn').addEventListener('click', (event) => {
        const btn = event.currentTarget;
        const info = document.getElementById('heroInfo');
        const open = info.hidden;
        info.hidden = !open;
        btn.setAttribute('aria-expanded', String(open));
    });

    document.getElementById('exerciseClear').addEventListener('click', () => {
        selectExercise('');
        document.getElementById('exerciseSearch').focus();
    });

    window.addEventListener('DOMContentLoaded', () => {
        renderSuggestions();
        syncActivePills();

        const chartCanvas = document.getElementById('progressChart');
        const chartTip = document.getElementById('chartTip');
        const notePointer = (event) => { chartPointerType = event.pointerType || 'mouse'; };
        chartCanvas.addEventListener('pointerdown', notePointer, { capture: true });
        chartCanvas.addEventListener('pointermove', notePointer, { capture: true });
        chartTip.addEventListener('click', () => {
            const idx = Number(chartTip.dataset.index);
            if (Number.isFinite(idx) && openChartTipPoint) openChartTipPoint(idx);
        });
        // Touch: tapping anywhere outside the chart and the box closes the box.
        document.addEventListener('pointerdown', (event) => {
            if (chartTip.hidden) return;
            if (chartTip.contains(event.target) || chartCanvas.contains(event.target)) return;
            hideChartTip();
        });

        if (initialExercise && initialExercise.value) {
            currentExercise = initialExercise.value;
            document.getElementById('exerciseSearch').value = initialExercise.label || initialExercise.value;
        }
        loadChart();
    });

    let resizeTimer = null;
    let lastPhoneLayout = null;
    window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
            if (!myChart || !fullChartData) return;
            const phone = isPhoneChart();
            if (lastPhoneLayout !== null && phone !== lastPhoneLayout) {
                renderChart(fullChartData);
            } else {
                myChart.options.scales.x.ticks.maxTicksLimit = window.innerWidth > 768 ? Math.min(Math.floor(window.innerWidth / 110), 10) : 4;
                myChart.update('none');
            }
            lastPhoneLayout = phone;
        }, 150);
    });

    window.getAiAssistantContext = () => ({
        page: 'stats',
        exercise: currentExercise || '',
        metric: currentMetric || 'e1rm',
        date: aiAssistantSelectedDate || '',
    });
</script>
