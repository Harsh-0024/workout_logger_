<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>You're offline - Workout Tracker</title>
  <script>
    // Settings → Appearance on this device: Dark or Light as chosen; Auto follows the phone.
    try {
      var theme = localStorage.getItem('workout-tracker-theme-preference');
      if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
    } catch (e) { /* storage off */ }
  </script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #000000;
      --text: #ffffff;
      --muted: #a1a1aa;
      --gold: #d4af37;
      --btn-text: #0b0b0c;
      --quiet-border: rgba(255, 255, 255, 0.14);
    }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        color-scheme: light;
        --bg: #f5f3ee;
        --text: #1c1917;
        --muted: #6b7280;
        --gold: #a8841f;
        --btn-text: #ffffff;
        --quiet-border: rgba(0, 0, 0, 0.14);
      }
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #f5f3ee;
      --text: #1c1917;
      --muted: #6b7280;
      --gold: #a8841f;
      --btn-text: #ffffff;
      --quiet-border: rgba(0, 0, 0, 0.14);
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      text-align: center;
      padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
    }
    main { max-width: 360px; }
    h1 {
      margin: 0 0 10px;
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: 500;
      font-size: 1.9rem;
    }
    p { margin: 0 0 28px; color: var(--muted); line-height: 1.55; }
    .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    a, button {
      font: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 12px;
      padding: 10px 18px;
      cursor: pointer;
      text-decoration: none;
    }
    a { background: var(--gold); color: var(--btn-text); border: 1px solid var(--gold); }
    button { background: none; color: var(--text); border: 1px solid var(--quiet-border); }
  </style>
</head>
<body>
  <main>
    <h1>You're offline</h1>
    <p>This page isn't saved on this device yet. You can still log a workout: it's kept here and uploads when you're back online.</p>
    <div class="actions">
      <a href="/log">Log a workout</a>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </div>
  </main>
</body>
</html>
