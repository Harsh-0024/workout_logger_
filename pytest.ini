[pytest]
testpaths = tests
pythonpath = .
# flask_login's remember-me cookie calls datetime.utcnow() (deprecated in Python 3.12); it's
# the library's, not ours, and changes nothing until a flask_login release fixes it.
filterwarnings =
    ignore:datetime.datetime.utcnow\(\) is deprecated:DeprecationWarning:flask_login
